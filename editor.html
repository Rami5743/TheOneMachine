<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>עורך פתרונות — המכונה האחת</title>
<!-- Reuse the game's own component styling + markup so the editor looks identical.
     The editor is a dev tool, so it takes its three shared files FRESH on every
     load (?v=<timestamp>) instead of carrying its own ?v= tags. Those tags used
     to be copies of index.html's and went stale without anyone noticing — and a
     stale component-visuals.js draws every card added since as an empty box,
     which is exactly what "the solution has no PC0 in it" looks like. -->
<script>
  (function () {
    var v = "?v=" + Date.now();
    document.write('<link rel="stylesheet" href="css/styles.css' + v + '" />');
    document.write('<scr' + 'ipt src="js/component-visuals.js' + v + '"></scr' + 'ipt>');
    // Embedded solutions so the editor loads them from file:// too (fetch is blocked there)
    document.write('<scr' + 'ipt src="assets/solutions/solutions.js' + v + '"></scr' + 'ipt>');
  }());
</script>
<style>
  :root { --bg:#2b2620; --panel:#38312a; --ink:#f3ead9; --muted:#b6a88f; --accent:#d8a24a; --line:#5a4f40; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font-family: system-ui, "Segoe UI", Arial, sans-serif; }
  .app { display:flex; height:100vh; }
  .canvas-wrap { flex:1; position:relative; overflow:hidden; }
  #stage { width:100%; height:100%; display:block; background:#7a6a4e; }
  .side { width:320px; background:var(--panel); border-inline-start:1px solid var(--line);
    display:flex; flex-direction:column; overflow:auto; }
  .side h2 { font-size:15px; margin:0; padding:12px 14px; border-bottom:1px solid var(--line); }
  .side section { padding:12px 14px; border-bottom:1px solid var(--line); }
  .side label { display:block; font-size:12px; color:var(--muted); margin:8px 0 3px; }
  .side input[type=text], .side input[type=number], .side textarea, .side select {
    width:100%; background:#241f19; color:var(--ink); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; font-size:13px; font-family:inherit; }
  .side textarea { min-height:120px; resize:vertical; direction:ltr; text-align:left; font-family:ui-monospace,monospace; font-size:11px; }
  .row { display:flex; gap:8px; } .row > * { flex:1; }
  button { background:var(--accent); color:#231c10; border:0; border-radius:6px;
    padding:8px 10px; font-size:13px; font-weight:600; cursor:pointer; font-family:inherit; }
  button.ghost { background:#463d31; color:var(--ink); }
  .toolbar { display:flex; gap:8px; padding:10px 14px; flex-wrap:wrap; align-items:center; }
  .toolbar .title { font-weight:700; margin-inline-end:auto; }
  .hint { font-size:11px; color:var(--muted); line-height:1.5; }
  .pin-row { display:flex; gap:6px; align-items:center; margin:4px 0; }
  .pin-row .pid { width:78px; font-size:11px; color:var(--muted); direction:ltr; text-align:left; }
  .pin-row input { flex:1; }
  .selected-outline { stroke:var(--accent); stroke-width:2; fill:none; pointer-events:none; }
  .file-in { display:none; }
  .badge { font-size:11px; color:var(--muted); }
  .toggle { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); cursor:pointer; }
  .drag-hit { cursor:move; }
  /* editor wire styling (matches the board's cable / bus look) */
  .ed-cable { stroke:#1c1712; stroke-width:4; fill:none; stroke-linecap:round; }
  .ed-bus { stroke:#1c1712; stroke-width:10; fill:none; stroke-linecap:round; }
  .ed-bus-stripe { stroke:#efe6d2; stroke-width:3; stroke-dasharray:6 3; fill:none; }
  .ed-frame { fill:none; stroke:#efe6d2; stroke-width:3; }
  .ed-frame-bus { stroke:#1c1712; stroke-width:10; fill:none; }
  .ed-frame-cable { stroke:#1c1712; stroke-width:4; fill:none; }
  .ed-frame-label { fill:#e7d9bb; font-size:20px; }
  .ed-pin { fill:#c9bda2; }
  .ed-pin-bus { fill:#d8a24a; }
  .ed-pin-label { fill:#9c8f77; font-size:11px; }
  /* wiring mode: every pin of every card becomes a target, and the cable being
     drawn follows the pointer until its second pin is picked. */
  .ed-wire-pin { fill:#2e2721; stroke:#d8a24a; stroke-width:2; }
  .ed-wire-pin-bus { fill:#2e2721; stroke:#8fd7a8; stroke-width:2.5; }
  .ed-wire-pin-armed { fill:#d8a24a; stroke:#fff3d6; stroke-width:2.5; }
  .ed-wire-pin-label { fill:#f3ead9; font-size:10px; paint-order:stroke; stroke:#2b2620; stroke-width:3px; }
  .ed-wire-ghost { stroke:#d8a24a; stroke-width:3; stroke-dasharray:7 5; fill:none; pointer-events:none; }
  .ed-wire-selected { stroke:#d8a24a; stroke-width:3; fill:none; pointer-events:none; }
  .wiring #stage { cursor: crosshair; }
</style>
</head>
<body>
<div class="app">
  <div class="canvas-wrap">
    <div class="toolbar">
      <span class="title">עורך פתרונות</span>
      <label class="toggle"><input type="checkbox" id="snap" checked> הצמדה</label>
      <label class="toggle"><input type="checkbox" id="showcheck"> מנגנוני בדיקה</label>
      <label class="toggle"><input type="checkbox" id="wiremode"> חיווט</label>
      <button class="ghost" id="btn-load">טען JSON…</button>
      <button id="btn-save">שמור JSON</button>
      <button id="btn-bundle" title="מייצר את assets/solutions/solutions.js עם הפתרון הנוכחי ממוזג לשאר">שמור חבילה</button>
      <input type="file" id="file" class="file-in" accept=".json,application/json" />
    </div>
    <svg id="stage" viewBox="0 0 1200 760" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <aside class="side">
    <h2>מאפיינים</h2>
    <section id="props"><p class="hint">בחר רכיב, פין או מנגנון בדיקה על הלוח כדי לערוך אותו. גרור להזיז. סמן "מנגנוני בדיקה" כדי להציג ולהזיז ממירים/מפצלים/מנורות.</p></section>
    <section>
      <label>JSON (מודפס חי — אפשר להדביק ולטעון)</label>
      <textarea id="json-box" spellcheck="false"></textarea>
      <div class="row" style="margin-top:8px;">
        <button class="ghost" id="btn-apply">טען מהטקסט</button>
        <button class="ghost" id="btn-copy">העתק</button>
      </div>
    </section>
    <section><div class="hint" id="status"></div></section>
  </aside>
</div>

<script>
"use strict";
const NS = "http://www.w3.org/2000/svg";
// ---- reuse the game's markup ----
const esc = (s)=>String(s==null?"":s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const gateComponentType = (id)=>"gate-"+id;
const taskDefById = (id)=>({ id });
// Minimal defs for the bus gates used in solutions, so busGateSpec routes them
// through the game's busGateMarkup (base symbol + bus bars), identical to the game.
const DEFS = {
  "gate-AND16": { busGate:true, op:"And", busWidth:16, inputs:2, control:false },
  "gate-OR16":  { busGate:true, op:"Or",  busWidth:16, inputs:2, control:false },
  "gate-Not16": { busGate:true, op:"Not", busWidth:16, inputs:1, control:false },
  "gate-MUX16": { busGate:true, op:"Mux", busWidth:16, inputs:3, control:true },
  // The plain 2.3 routing cards, reused inside the 3.4 solutions.
  "gate-DMux": { plainGate:true, label:"DMux" },
  "gate-Mux": { plainGate:true, label:"Mux" },
  "gate-Neq0_16": { busGate:true, op:"Neq0", busWidth:16, inputs:1, control:false },
  "gate-Neq0_4":  { busGate:true, op:"Neq0", busWidth:4,  inputs:1, control:false },
  // The 3.3 RAM cards: a bank of 16-bit values picked by an address bus.
  "gate-RAM4":    { ramGate:true, busWidth:16, addressWidth:2,  slots:4 },
  "gate-RAM16":   { ramGate:true, busWidth:16, addressWidth:4,  slots:16 },
  "gate-RAM64":   { ramGate:true, busWidth:16, addressWidth:6,  slots:64 },
  "gate-RAM256":  { ramGate:true, busWidth:16, addressWidth:8,  slots:256 },
  "gate-RAM1024": { ramGate:true, busWidth:16, addressWidth:10, slots:1024 },

  // OUTPUTS mirror its registers, port INPUTS are read-only addresses fed from
  // outside. IPorts holds nothing at all (it runs on the Mux4Way16 branch), but
  // on the board it is a card of its own, not a MUX.
  "gate-OPorts": { ramGate:true, portsCard:true, label:"OPorts", busWidth:16, addressWidth:2, slots:4, portOutputs:4 },

  "gate-Ports":  { ramGate:true, portsCard:true, label:"Ports", busWidth:16, addressWidth:3, slots:4, portOutputs:4, portInputs:4 },

  // The 2.4 wide-routing cards: a 2-bit control bus picks one of four.
  "gate-Dmux4way":  { wideRoutingGate:"dmux4way" },
  "gate-Mux4way16": { wideRoutingGate:"mux4way16", busWidth:16 },

  // componentMarkup (pcGateMarkup / contGateMarkup / cpuGateMarkup), so these
  // entries only have to exist and carry their bus width.

  "gate-Cont0": { contGate:true, label:"Cont0", busWidth:2 },
  "gate-CPU0":  { cpuGate:true, label:"CPU0", busWidth:16 },
  // The 4.4 cards. Same story — componentMarkup draws them by name, so these
  // entries only have to exist; without them the editor drew an empty box and
  // the wires had nowhere to land.
  "gate-PC":     { pcGate:true, pcLoad:true, label:"PC", busWidth:16 },
  "gate-JmpCnt": { jmpGate:true, label:"JmpCnt", busWidth:2 },
  "gate-Cont":   { contJumpGate:true, label:"Cont", busWidth:4 },
  "gate-CPU":    { cpuGate:true, cpuJump:true, label:"CPU", busWidth:16 },
  // 3.5: the program memory. Two 16-bit address pins, of which only the last 10
  // address the bank (addressBits), plus data in, control on top and the word out.
  "gate-Prg":    { prgGate:true, label:"Prg", busWidth:16, addressWidth:16, addressBits:10, slots:1024 }
};
const busGateSpec = (type)=>{ const d=DEFS[type]; return d && d.busGate ? { op:d.op, inputs:d.inputs||1, width:d.busWidth, control:!!d.control } : null; };
const ramGateSpec = (type)=>{ const d=DEFS[type]; return d && d.ramGate ? { width:d.busWidth, addressWidth:d.addressWidth, slots:d.slots, portOutputs:d.portOutputs||0, portInputs:d.portInputs||0 } : null; };
const wideRoutingGateSpec = (type)=>{ const d=DEFS[type]; return d && d.wideRoutingGate ? { kind:d.wideRoutingGate, width:d.busWidth||1 } : null; };
const CV = createComponentVisuals({ esc, gateComponentType, taskDefById, busGateSpec, ramGateSpec, wideRoutingGateSpec, savedCardMarkup:null, componentDefs: DEFS });

// ---- pin geometry (for wire endpoints); matches the game's defs ----
const SPLIT_SPACING = 34;
function splitterPin(comp, pinId) {
  const n = Math.min(16, Math.max(2, comp.outputs || 4)); const mir = !!comp.mirrored;
  // Legs need not be equal: legWidths[] gives each its own width (leg 0 = the low
  // chunk) and the single side carries their sum. A splitter with only the legacy
  // scalar `width` means every leg is that wide.
  const legs = Array.isArray(comp.legWidths) ? comp.legWidths : null;
  const legW = (i) => (legs ? (Number(legs[i]) || 1) : (comp.width || 1));
  const singleW = legs ? legs.reduce((sum, w) => sum + (Number(w) || 1), 0) : (comp.width || 1) * n;
  if (pinId === "single") return { x: mir?38:-38, y:0, w: comp.singleWidth || singleW };
  const m = pinId.match(/^leg(\d+)$/);
  if (m) { const i=Math.min(n-1,Math.max(0,+m[1])); return { x: mir?-37:37, y:Math.round(((n-1)/2 - i)*SPLIT_SPACING), w: legW(i) }; }
  return null;
}
const PINS = {
  source:{ out:{x:40,y:0,w:1} },
  "gate-PreperNum":{ in1:{x:-76,y:0,w:16}, in2:{x:0,y:-60,w:2}, out1:{x:80,y:0,w:16} },
  "gate-ALU0":{ in1:{x:-62,y:-26,w:16}, in2:{x:-62,y:26,w:16}, in3:{x:0,y:-46,w:1}, out1:{x:66,y:0,w:16} },
  "gate-ALU1":{ in1:{x:-62,y:-26,w:16}, in2:{x:-62,y:26,w:16}, in3:{x:0,y:-46,w:6}, out1:{x:66,y:0,w:16} },
  "gate-ALU2":{ in1:{x:-62,y:-40,w:16}, in2:{x:-62,y:0,w:16}, in3:{x:-62,y:40,w:16}, in4:{x:0,y:-58,w:7}, out1:{x:66,y:0,w:16} },
  "gate-ALU3":{ in1:{x:-62,y:-40,w:16}, in2:{x:-62,y:0,w:16}, in3:{x:-62,y:40,w:16}, in4:{x:0,y:-58,w:12}, out1:{x:66,y:0,w:16} },
  "gate-ALU4":{ in1:{x:-62,y:-40,w:16}, in2:{x:-62,y:0,w:16}, in3:{x:-62,y:40,w:16}, in4:{x:0,y:-58,w:12}, out1:{x:66,y:0,w:16}, out2:{x:-20,y:66,w:1}, out3:{x:20,y:66,w:1} },
  // Cards a solution may legitimately use that the mirror was missing.
  "gate-AND3way":{ in1:{x:-62,y:-27,w:1}, in2:{x:-62,y:0,w:1}, in3:{x:-62,y:27,w:1}, out:{x:66,y:0,w:1} },
  "gate-OR4way":{ in1:{x:-60.326107,y:-30,w:1}, in2:{x:-59.462559,y:-9.9898129,w:1}, in3:{x:-59.919762,y:10.020376,w:1}, in4:{x:-60.369907,y:30,w:1}, out:{x:80,y:0,w:1} },
  "gate-Not4":{ in1:{x:-60,y:0,w:4}, out:{x:80,y:0,w:4} },
  "gate-AND4":{ in1:{x:-62,y:-23,w:4}, in2:{x:-62,y:23,w:4}, out:{x:66,y:0,w:4} },
  "gate-OR4":{ in1:{x:-58,y:-23,w:4}, in2:{x:-58,y:23,w:4}, out:{x:80,y:0,w:4} },
  "gate-MUX4":{ in1:{x:-62,y:-23,w:4}, in2:{x:-62,y:23,w:4}, in3:{x:0,y:-46,w:1}, out:{x:66,y:0,w:4} },
  "gate-AND16":{ in1:{x:-62,y:-23,w:16}, in2:{x:-62,y:23,w:16}, out:{x:66,y:0,w:16} },
  "gate-OR16":{ in1:{x:-58,y:-23,w:16}, in2:{x:-58,y:23,w:16}, out:{x:80,y:0,w:16} },
  "gate-Add16":{ in1:{x:-76,y:-26,w:16}, in2:{x:-76,y:26,w:16}, out1:{x:80,y:0,w:16} },
  "gate-Not16":{ in1:{x:-60,y:0,w:16}, out:{x:80,y:0,w:16} },
  "gate-MUX16":{ in1:{x:-62,y:-23,w:16}, in2:{x:-62,y:23,w:16}, in3:{x:0,y:-46,w:1}, out:{x:66,y:0,w:16} },
  // The plain 2.3 cards: single-wire pins, control on top.
  "gate-DMux":{ in1:{x:-62,y:0,w:1}, in2:{x:0,y:-46,w:1}, out1:{x:66,y:-23,w:1}, out2:{x:66,y:23,w:1} },
  "gate-Mux":{ in1:{x:-62,y:-23,w:1}, in2:{x:-62,y:23,w:1}, in3:{x:0,y:-46,w:1}, out:{x:66,y:0,w:1} },
  "gate-Inc":{ in1:{x:-76,y:0,w:16}, out1:{x:80,y:0,w:16} },
  "gate-Neq0_16":{ in1:{x:-60,y:0,w:16}, out:{x:80,y:0,w:1} },
  "gate-Neq0_4":{ in1:{x:-60,y:0,w:4}, out:{x:80,y:0,w:1} },
  // 2.5 arithmetic gates (single-bit unless noted) — so their solution wires draw.
  "gate-And":{ in1:{x:-62,y:-23,w:1}, in2:{x:-62,y:23,w:1}, out:{x:66,y:0,w:1} },
  "gate-Xor":{ in1:{x:-60,y:-23,w:1}, in2:{x:-60,y:23,w:1}, out:{x:80,y:0,w:1} },
  "gate-Or":{ in1:{x:-58,y:-23,w:1}, in2:{x:-58,y:23,w:1}, out:{x:80,y:0,w:1} },
  "gate-Not":{ in1:{x:-60,y:0,w:1}, out:{x:80,y:0,w:1} },
  "gate-halfAdder":{ in1:{x:-62,y:-23,w:1}, in2:{x:-62,y:23,w:1}, out2:{x:66,y:-23,w:1}, out1:{x:66,y:23,w:1} },
  "gate-fullAdder":{ in1:{x:-62,y:-27,w:1}, in2:{x:-62,y:0,w:1}, in3:{x:-62,y:27,w:1}, out2:{x:66,y:-23,w:1}, out1:{x:66,y:23,w:1} },
  "gate-Add4":{ in1:{x:-76,y:-52,w:4}, in2:{x:-76,y:0,w:4}, in3:{x:-76,y:52,w:1}, out2:{x:80,y:-34,w:1}, out1:{x:80,y:34,w:4} },
  // 3.1 memory: a data bus in, a single control on top, the stored bus out.
  // The נעץ: both pins sit at the dot's centre, so a cable through it is straight.
  nail:{ in:{x:0,y:0,w:1}, out:{x:0,y:0,w:1} },
  ffCard:{ in1:{x:-66,y:0,w:1}, in2:{x:0,y:-46,w:1}, out:{x:66,y:0,w:1} },
  "gate-Register4":{ in1:{x:-80,y:0,w:4}, in2:{x:0,y:-46,w:1}, out:{x:80,y:0,w:4} },
  "gate-Register":{ in1:{x:-80,y:0,w:16}, in2:{x:0,y:-46,w:1}, out:{x:80,y:0,w:16} },

  "gate-RAM4":{ in3:{x:-92,y:-24,w:2}, in1:{x:-92,y:24,w:16}, in2:{x:0,y:-56,w:1}, out:{x:92,y:0,w:16} },
  "gate-RAM16":{ in3:{x:-92,y:-24,w:4}, in1:{x:-92,y:24,w:16}, in2:{x:0,y:-56,w:1}, out:{x:92,y:0,w:16} },
  "gate-RAM64":{ in3:{x:-92,y:-24,w:6}, in1:{x:-92,y:24,w:16}, in2:{x:0,y:-56,w:1}, out:{x:92,y:0,w:16} },
  "gate-RAM256":{ in3:{x:-92,y:-24,w:8}, in1:{x:-92,y:24,w:16}, in2:{x:0,y:-56,w:1}, out:{x:92,y:0,w:16} },
  "gate-RAM1024":{ in3:{x:-92,y:-24,w:10}, in1:{x:-92,y:24,w:16}, in2:{x:0,y:-56,w:1}, out:{x:92,y:0,w:16} },
  // 3.4 ports: address + data + (for Ports/RAM) four device buses down the left,
  // the data output + four port buses down the right, control on top.
  "gate-OPorts":{ in3:{x:-98,y:-170,w:2}, in1:{x:-98,y:-130,w:16}, in2:{x:0,y:-260,w:1}, out:{x:98,y:-130,w:16},
    outP1:{x:98,y:8,w:16}, outP2:{x:98,y:68,w:16}, outP3:{x:98,y:128,w:16}, outP4:{x:98,y:188,w:16} },
  "gate-IPorts":{ in5:{x:-98,y:-130,w:2}, in1:{x:-98,y:8,w:16}, in2:{x:-98,y:68,w:16},
    in3:{x:-98,y:128,w:16}, in4:{x:-98,y:188,w:16}, out:{x:98,y:-130,w:16} },
  "gate-Ports":{ in3:{x:-98,y:-170,w:3}, in1:{x:-98,y:-130,w:16}, in2:{x:0,y:-260,w:1}, out:{x:98,y:-130,w:16},
    outP1:{x:98,y:8,w:16}, outP2:{x:98,y:68,w:16}, outP3:{x:98,y:128,w:16}, outP4:{x:98,y:188,w:16},
    inP1:{x:-98,y:8,w:16}, inP2:{x:-98,y:68,w:16}, inP3:{x:-98,y:128,w:16}, inP4:{x:-98,y:188,w:16} },
  "gate-RAM":{ in3:{x:-98,y:-170,w:16}, in1:{x:-98,y:-130,w:16}, in2:{x:0,y:-260,w:1}, out:{x:98,y:-130,w:16},
    outP1:{x:98,y:8,w:16}, outP2:{x:98,y:68,w:16}, outP3:{x:98,y:128,w:16}, outP4:{x:98,y:188,w:16},
    inP1:{x:-98,y:8,w:16}, inP2:{x:-98,y:68,w:16}, inP3:{x:-98,y:128,w:16}, inP4:{x:-98,y:188,w:16} },
  // 2.4 wide routing: a 2-bit control bus on top picks one of four.
  "gate-Dmux4way":{ in1:{x:-62,y:0,w:1}, in2:{x:0,y:-46,w:2},
    out1:{x:66,y:-30,w:1}, out2:{x:66,y:-10,w:1}, out3:{x:66,y:10,w:1}, out4:{x:66,y:30,w:1} },
  "gate-Mux4way16":{ in1:{x:-62,y:-60,w:16}, in2:{x:-62,y:-20,w:16}, in3:{x:-62,y:20,w:16}, in4:{x:-62,y:60,w:16},
    in5:{x:0,y:-66,w:2}, out:{x:66,y:0,w:16} },
  // 4.2: the counter (reset on top, the count out), the control unit (the 2-bit
  // destination field in, one wire per destination out) and the processor.
  "gate-PC0":{ in1:{x:0,y:-46,w:1}, out:{x:80,y:0,w:16} },
  "gate-Cont0":{ in1:{x:-90,y:0,w:2}, out1:{x:90,y:-30,w:1}, out2:{x:90,y:0,w:1}, out3:{x:90,y:30,w:1} },
  "gate-CPU0":{ in1:{x:-110,y:-50,w:16}, in2:{x:-110,y:50,w:16}, in3:{x:0,y:-170,w:1},
    out1:{x:110,y:-30,w:16}, out2:{x:110,y:-85,w:16}, out3:{x:110,y:30,w:16}, out4:{x:110,y:85,w:1} },
  "gate-Prg":{ in3:{x:-96,y:-60,w:16}, in4:{x:-96,y:0,w:16}, in1:{x:-96,y:60,w:16}, in2:{x:0,y:-110,w:1}, out:{x:96,y:0,w:16} },
  // 4.4: the counter that jumps (load beside reset on top, the number to jump to
  // in on the left), the jump decider, the whole control unit, and the processor
  // — whose terminals are CPU0's exactly.
  "gate-PC":{ in2:{x:-30,y:-46,w:1}, in1:{x:30,y:-46,w:1}, in3:{x:-80,y:0,w:16}, out:{x:80,y:0,w:16} },
  "gate-JmpCnt":{ in1:{x:-80,y:-40,w:2}, in2:{x:-80,y:0,w:1}, in3:{x:-80,y:40,w:1}, out:{x:80,y:0,w:1} },
  "gate-Cont":{ in1:{x:-80,y:-40,w:4}, in2:{x:-80,y:0,w:1}, in3:{x:-80,y:40,w:1},
    out1:{x:80,y:-60,w:1}, out2:{x:80,y:-20,w:1}, out3:{x:80,y:20,w:1}, out4:{x:80,y:60,w:1} },
  "gate-CPU":{ in1:{x:-110,y:-50,w:16}, in2:{x:-110,y:50,w:16}, in3:{x:0,y:-170,w:1},
    out1:{x:110,y:-30,w:16}, out2:{x:110,y:-85,w:16}, out3:{x:110,y:30,w:16}, out4:{x:110,y:85,w:1} }
};
// The game shrinks gates (and the Nand) to GATE_RENDER_SCALE past the simple-gate
// chapter (see componentRenderScale in app.js). Every solution this editor edits
// lives in those later chapters, so gate bodies AND their pin offsets render at
// 0.6 here too — otherwise the editor drew gates at full size while the wires
// still met the 0.6-scaled pins, so cables landed inside oversized bodies.
// Splitters, the source and the task-card frame keep scale 1, exactly as the game.
const GATE_RENDER_SCALE = 0.6;
function edScale(type){ const t=String(type||""); return (t.startsWith("gate-")||t==="nand") ? GATE_RENDER_SCALE : 1; }
function pinOffset(comp, pinId) {
  if (comp.__frame) { const p=(doc.frame.pins||[]).find(pp=>pp.id===pinId); return p?{x:p.x,y:p.y,w:p.w}:null; }
  if (comp.type === "splitter") return splitterPin(comp, pinId);
  const t = PINS[comp.type]; const off = t && t[pinId] ? t[pinId] : null;
  if (!off) return null;
  const s = edScale(comp.type);
  return s===1 ? off : { x: off.x*s, y: off.y*s, w: off.w };
}

// ---- check mechanisms (the "harness"): the converters / merging splitter /
// lamps the game places during the check. The editor derives one element per
// external card pin (numeric input → dec-bin converter, control input → merging
// splitter, numeric output → bin-dec converter, single-bit output → lamp) and
// lets you drag each; a moved element's absolute position is stored under
// doc.harness.inputs[ref] / doc.harness.outputs[ref], which the game reads. ----
function isControlPin(p){ return p.y < -150; }
function harnessStore(){ doc.harness=doc.harness||{}; doc.harness.inputs=doc.harness.inputs||{}; doc.harness.outputs=doc.harness.outputs||{}; return doc.harness; }
function harnessElements(){
  const f=doc.frame||{}, out=[];
  for(const p of (f.pins||[])){
    if(!p.id.includes("Ext")) continue;
    const w=p.w||1;
    if(p.dir==="out"){
      out.push({side:"outputs",ref:p.id,kind:w>1?"conv-in":"lamp",w,def:{x:w>1?1120:1180,y:f.y+p.y}});
    } else {
      if(w===1) continue; // single-bit inputs are driven straight from the source
      const ctrl=isControlPin(p);
      out.push({side:"inputs",ref:p.id,kind:ctrl?"split":"conv-out",w,def:{x:ctrl?210:120,y:f.y+p.y}});
    }
  }
  return out;
}
function harnessPos(e){ const s=(doc.harness&&doc.harness[e.side]||{})[e.ref];
  return (s&&Number.isFinite(s.x)&&Number.isFinite(s.y))?{x:s.x,y:s.y}:e.def; }
function setHarnessPos(e,x,y){ const h=harnessStore(); h[e.side][e.ref]={x:Math.round(x),y:Math.round(y)}; }

// ---- document ----
let doc=null, selected=null, dragging=null;
// Wiring mode: pendingPin holds the first pin of the cable being drawn, ghostAt
// the pointer, so the half-drawn cable is visible while the second pin is picked.
let pendingPin=null, ghostAt=null;
const wiring = () => document.getElementById("wiremode").checked;
const stage=document.getElementById("stage");
function movable(){ return [...(doc.external||[]), ...(doc.components||[])]; }
function findComp(id){ if (doc.frame && id===doc.frame.id) return {...doc.frame,__frame:true}; return movable().find(c=>c.id===id)||null; }

// ---- wiring ----------------------------------------------------------------
// Every pin a cable may land on, as the "<componentId>.<pinId>" refs the wires
// themselves use. The frame's come from the doc; a splitter's are generated from
// its leg count; everything else reads the PINS table above.
function pinIdsOf(comp){
  if (comp.__frame) return (doc.frame.pins||[]).map(p=>p.id);
  if (comp.type==="splitter"){
    const n=Math.min(16,Math.max(2,comp.outputs||4));
    return ["single", ...Array.from({length:n},(_,i)=>"leg"+i)];
  }
  return Object.keys(PINS[comp.type]||{});
}
function allPinRefs(){
  const out=[];
  if (doc.frame) for (const id of pinIdsOf({...doc.frame,__frame:true})) out.push(doc.frame.id+"."+id);
  for (const c of movable()) for (const id of pinIdsOf(c)) out.push(c.id+"."+id);
  return out;
}
function wireExists(a,b){ return (doc.wires||[]).some(w=>(w.a===a&&w.b===b)||(w.a===b&&w.b===a)); }
function partOfRef(ref){ const d=String(ref).lastIndexOf("."); return d<0?String(ref):String(ref).slice(0,d); }
function nailIds(){ return new Set(movable().filter(c=>c.type==="nail").map(c=>c.id)); }

// How wide each cable actually is. A נעץ has NO width of its own — it carries
// whatever arrives, and the game works that out by propagation. The editor used
// to read the nail's nominal w:1 and draw a 16-bit bus running through one as a
// thin single wire, which is why so much of a solution looked like it was made
// of the wrong thing. Propagate widths across nails to a fixpoint instead.
function wireWidths(){
  const wires = doc.wires||[];
  const w = wires.map((wire)=>{ const a=absPin(wire.a), b=absPin(wire.b);
    return Math.max((a&&a.w)||1, (b&&b.w)||1); });
  const nails = nailIds();
  if (!nails.size) return w;
  for (let pass=0; pass<12; pass+=1){
    const widest=new Map();
    wires.forEach((wire,i)=>{ for(const ref of [wire.a,wire.b]){ const id=partOfRef(ref);
      if(nails.has(id)) widest.set(id, Math.max(widest.get(id)||1, w[i])); } });
    let changed=false;
    wires.forEach((wire,i)=>{ for(const ref of [wire.a,wire.b]){ const id=partOfRef(ref);
      if(!nails.has(id)) continue; const nw=widest.get(id)||1;
      if(nw>w[i]){ w[i]=nw; changed=true; } } });
    if(!changed) break;
  }
  return w;
}
// The width a pin presents for wiring: a nail's is whatever its cables carry.
function effectivePinWidth(ref){
  const at=absPin(ref); if(!at) return null;
  const id=partOfRef(ref);
  if(!nailIds().has(id)) return at.w||1;
  const w=wireWidths(); let best=0;
  (doc.wires||[]).forEach((wire,i)=>{ if(partOfRef(wire.a)===id||partOfRef(wire.b)===id) best=Math.max(best,w[i]); });
  return best||null;   // null = "carries anything", so any width may join it
}
function cancelWire(){ pendingPin=null; ghostAt=null; }

// Click a pin in wiring mode: the first click arms the cable, the second lays
// it. A cable between pins of DIFFERENT widths is refused — in the game that is
// not a cable at all, and a solution carrying one silently fails to evaluate.
function pinClick(ref){
  if (!pendingPin){ pendingPin=ref; status("נבחר "+ref+" — עכשיו בחר את הפין השני (Esc לביטול)"); render(); renderProps(); return; }
  if (pendingPin===ref){ cancelWire(); status("בוטל"); render(); return; }
  const a=absPin(pendingPin), b=absPin(ref);
  if (!a||!b){ cancelWire(); status("אחד הפינים לא נמצא"); render(); return; }
  // A נעץ carries whatever arrives, so it never mismatches; everything else must
  // agree, or the "cable" is not a cable the game can evaluate.
  const wa=effectivePinWidth(pendingPin), wb=effectivePinWidth(ref);
  if (wa && wb && wa!==wb){ status("רוחב לא תואם: "+pendingPin+" ["+wa+"] מול "+ref+" ["+wb+"] — לא נוצר חיבור"); cancelWire(); render(); return; }
  if (wireExists(pendingPin,ref)){ status("החיבור כבר קיים"); cancelWire(); render(); return; }
  doc.wires.push({ a:pendingPin, b:ref });
  status("נוסף חיבור: "+pendingPin+" ↔ "+ref+" ("+doc.wires.length+" חיבורים)");
  cancelWire(); render(); renderProps(); syncJsonBox();
}
function deleteWire(index){
  if (!doc.wires[index]) return;
  const w=doc.wires.splice(index,1)[0];
  status("נמחק חיבור: "+w.a+" ↔ "+w.b+" ("+doc.wires.length+" חיבורים)");
  selected=null; render(); renderProps(); syncJsonBox();
}
function absPin(ref){ const dot=ref.lastIndexOf("."); const cid=ref.slice(0,dot), pid=ref.slice(dot+1);
  const comp = (cid===doc.frame.id)?{...doc.frame,__frame:true}:findComp(cid); if(!comp) return null;
  const off = pinOffset(comp,pid); if(!off) return null; return {x:comp.x+off.x, y:comp.y+off.y, w:off.w}; }

function el(tag, attrs, kids){ const e=document.createElementNS(NS,tag); for(const k in attrs)e.setAttribute(k,attrs[k]); if(kids)for(const c of kids)e.appendChild(c); return e; }
function svgNode(str, x, y){ const g=document.createElementNS(NS,"g"); g.setAttribute("transform",`translate(${x} ${y})`); g.innerHTML=str; return g; }

function render(){
  while(stage.firstChild) stage.removeChild(stage.firstChild);
  if(!doc) return;
  const f=doc.frame, fw=f.frameW||600, fh=f.frameH||420;
  // frame shell (rect + pin stubs) — matches renderMultibitTaskShell
  const board = el("g",{});
  stage.appendChild(board);
  board.appendChild(el("rect",{ x:f.x-fw/2, y:f.y-fh/2, width:fw, height:fh, rx:18, class:"ed-frame" }));
  board.appendChild(el("text",{ x:f.x, y:f.y-fh/2-10, "text-anchor":"middle", class:"ed-frame-label" },[txt(doc.task||f.type)]));
  for (const p of (f.pins||[])){
    if (!p.id.includes("Ext")) continue;
    const intp = (f.pins||[]).find(pp=>pp.id===p.id.replace("Ext","Int"));
    const ax=f.x+p.x, ay=f.y+p.y, w=p.w||1;
    if (p.y < -150){ const iy=f.y+(intp?intp.y:p.y+70);
      board.appendChild(el("line",{x1:ax,y1:ay,x2:ax,y2:iy, class:w>1?"ed-frame-bus":"ed-frame-cable"}));
    } else { const ix=f.x+(intp?intp.x:(p.x<0?p.x+80:p.x-80));
      board.appendChild(el("line",{x1:ax,y1:ay,x2:ix,y2:ay, class:w>1?"ed-frame-bus":"ed-frame-cable"})); }
  }
  // wires
  const wWidths = wireWidths();
  (doc.wires||[]).forEach((wire, i)=>{ const a=absPin(wire.a), b=absPin(wire.b); if(!a||!b) return;
    const wide=(wWidths[i]||1)>1;
    board.appendChild(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y, class:wide?"ed-bus":"ed-cable"}));
    if (wide) board.appendChild(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y, class:"ed-bus-stripe"}));
    if (selected==="wire:"+i) board.appendChild(el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y, class:"ed-wire-selected"}));
  });
  // frame pin dots + labels
  for (const p of (f.pins||[])){ const ax=f.x+p.x, ay=f.y+p.y;
    board.appendChild(el("circle",{cx:ax,cy:ay,r:(p.w>1)?6:4, class:(p.w>1)?"ed-pin-bus":"ed-pin"}));
    if (p.label) board.appendChild(el("text",{x:ax,y:ay-9,"text-anchor":"middle",class:"ed-pin-label"},[txt(p.w>1?("["+p.w+"]"):"")])); }
  // frame drag-hit (behind components)
  const fh2=el("rect",{x:f.x-fw/2,y:f.y-fh/2,width:fw,height:fh,rx:18,fill:"transparent",class:"drag-hit"});
  fh2.addEventListener("pointerdown",(ev)=>startDrag(ev,f,true)); board.appendChild(fh2);
  // components via the game's markup
  for (const c of movable()) board.appendChild(drawComp(c));
  // check mechanisms (harness), when shown — behind the pin hit-targets
  if (document.getElementById("showcheck").checked){
    for (const e of harnessElements()) board.appendChild(drawHarnessEl(e));
  }
  // frame pin drag-targets (on top, so a pin is grabbable over any cable). In
  // wiring mode the frame's pins are wiring targets instead of drag handles —
  // otherwise picking one would move it.
  if (!wiring()) for (const p of (f.pins||[])){ const ax=f.x+p.x, ay=f.y+p.y;
    const hit=el("circle",{cx:ax,cy:ay,r:12,fill:"transparent",class:"drag-hit"});
    hit.addEventListener("pointerdown",(ev)=>startPinDrag(ev,p)); board.appendChild(hit); }

  // Wiring mode: a dot on EVERY pin of every card (and the frame), named, so a
  // cable can be laid without hunting for invisible geometry.
  if (wiring()){
    // A cable is clickable ABOVE the cards — otherwise a card body sitting over
    // its middle swallows the click and the cable can never be selected.
    (doc.wires||[]).forEach((wire, i)=>{ const a=absPin(wire.a), b=absPin(wire.b); if(!a||!b) return;
      const hit=el("line",{x1:a.x,y1:a.y,x2:b.x,y2:b.y, stroke:"transparent","stroke-width":16, class:"drag-hit"});
      hit.addEventListener("pointerdown",(ev)=>{ ev.stopPropagation(); cancelWire(); selected="wire:"+i; renderProps(); render(); });
      board.appendChild(hit);
    });
    if (pendingPin && ghostAt){ const a=absPin(pendingPin);
      if (a) board.appendChild(el("line",{x1:a.x,y1:a.y,x2:ghostAt.x,y2:ghostAt.y, class:"ed-wire-ghost"})); }
    for (const ref of allPinRefs()){
      const at=absPin(ref); if(!at) continue;
      const armed = pendingPin===ref;
      const ew = effectivePinWidth(ref);
      const cls = armed ? "ed-wire-pin-armed" : ((ew||1)>1 ? "ed-wire-pin-bus" : "ed-wire-pin");
      board.appendChild(el("circle",{cx:at.x,cy:at.y,r:armed?8:6, class:cls}));
      board.appendChild(el("text",{x:at.x,y:at.y-11,"text-anchor":"middle",class:"ed-wire-pin-label"},
        [txt(ref.slice(ref.lastIndexOf(".")+1)+((ew||1)>1?(" ["+ew+"]"):""))]));
      const hit=el("circle",{cx:at.x,cy:at.y,r:14,fill:"transparent",class:"drag-hit"});
      hit.addEventListener("pointerdown",(ev)=>{ ev.stopPropagation(); pinClick(ref); });
      board.appendChild(hit);
    }
  }
  // selection outline
  if (selected){
    if (selected.startsWith("pin:")){ const p=(f.pins||[]).find(pp=>pp.id===selected.slice(4));
      if(p) board.appendChild(el("circle",{cx:f.x+p.x,cy:f.y+p.y,r:12,class:"selected-outline"})); }
    else if (selected.startsWith("harness:")){ const e=harnessElements().find(x=>("harness:"+x.side+":"+x.ref)===selected);
      if(e){ const pos=harnessPos(e); const b=harnessBox(e); board.appendChild(el("rect",{x:pos.x-b.w/2-6,y:pos.y-b.h/2-6,width:b.w+12,height:b.h+12,rx:8,class:"selected-outline"})); } }
    else { const c=(selected==="frame")?{x:f.x,y:f.y,__frame:true}:findComp(selected);
      if (c){ const b=c.__frame?{w:fw,h:fh}:compBox(c); board.appendChild(el("rect",{x:c.x-b.w/2-6,y:c.y-b.h/2-6,width:b.w+12,height:b.h+12,rx:8,class:"selected-outline"})); } }
  }
  fitStage();
}
// The window follows the SOLUTION, never the other way round. The stage used to
// carry a fixed viewBox, so every time a frame grew or a pin moved outward the
// far edge of a big solution (Computer0, the ports cards) was quietly cut off —
// which is what "the solution is broken in the editor" has looked like every
// time. Measure what was actually drawn and show all of it, with a margin.
function fitStage(){
  const bb = stage.getBBox();
  if (!bb || !bb.width) return;
  const m = 30;
  const x = Math.min(0, bb.x - m);
  const y = Math.min(0, bb.y - m);
  const w = Math.max(1200, bb.x + bb.width + m - x);
  const h = Math.max(760, bb.y + bb.height + m - y);
  stage.setAttribute("viewBox", `${Math.round(x)} ${Math.round(y)} ${Math.round(w)} ${Math.round(h)}`);
}
function harnessBox(e){ if(e.kind==="split"){ const n=Math.min(16,Math.max(2,e.w)); return {w:150,h:(n-1)*SPLIT_SPACING+40}; }
  if(e.kind==="lamp") return {w:60,h:60}; return {w:120,h:96}; }
function drawHarnessEl(e){
  const pos=harnessPos(e);
  let markup;
  if(e.kind==="conv-out") markup=CV.componentMarkup("converter-out",{width:e.w,value:0});
  else if(e.kind==="conv-in") markup=CV.componentMarkup("converter-in",{width:e.w});
  else if(e.kind==="lamp") markup=CV.componentMarkup("lamp",{});
  else markup=CV.componentMarkup("splitter",{outputs:e.w,mirrored:true,width:1});
  const g=svgNode(markup,pos.x,pos.y);
  g.classList.add("drag-hit"); g.setAttribute("opacity","0.9");
  g.addEventListener("pointerdown",(ev)=>startHarnessDrag(ev,e));
  return g;
}
function txt(s){ return document.createTextNode(s==null?"":String(s)); }
// A card's own box, where it is not the 130x110 default (the RAM cards are a
// touch wider and taller than a register).
const BOX = {};
function compBox(c){ if(c.type==="nail") return {w:40,h:40}; if(c.type==="splitter"){ const n=Math.min(16,Math.max(2,c.outputs||4)); return {w:150,h:(n-1)*SPLIT_SPACING+40}; } if(c.type==="source") return {w:92,h:100}; const s=edScale(c.type); const b=BOX[c.type]|| (String(c.type).startsWith("gate-Ram")?{w:180,h:150}:{w:130,h:110}); return {w:b.w*s,h:b.h*s}; }
function drawComp(c){
  const opts = c.type==="splitter" ? { outputs:c.outputs, mirrored:c.mirrored, width:c.width, legWidths:c.legWidths } : {};
  const s = edScale(c.type);
  const g = document.createElementNS(NS,"g");
  g.setAttribute("transform",`translate(${c.x} ${c.y})`+(s!==1?` scale(${s})`:""));
  g.innerHTML = CV.componentMarkup(c.type, opts);
  g.classList.add("drag-hit");
  // In wiring mode a card is not a drag handle: the pins on it are the targets,
  // and dragging the body would move the card out from under the cable.
  g.addEventListener("pointerdown",(ev)=>{ if(wiring()){ ev.stopPropagation(); return; } startDrag(ev,c,false); });
  return g;
}

// ---- interaction ----
function svgPoint(ev){ const pt=stage.createSVGPoint(); pt.x=ev.clientX; pt.y=ev.clientY; const p=pt.matrixTransform(stage.getScreenCTM().inverse()); return {x:p.x,y:p.y}; }
function startDrag(ev, comp, isFrame){ ev.stopPropagation(); selected=isFrame?"frame":comp.id;
  const s=svgPoint(ev); dragging={comp,ox:comp.x,oy:comp.y,sx:s.x,sy:s.y,kind:"comp"}; try{stage.setPointerCapture(ev.pointerId);}catch{} renderProps(); render(); }
function startPinDrag(ev, pin){ ev.stopPropagation(); selected="pin:"+pin.id;
  const s=svgPoint(ev); dragging={pin,ox:pin.x,oy:pin.y,sx:s.x,sy:s.y,kind:"pin"}; try{stage.setPointerCapture(ev.pointerId);}catch{} renderProps(); render(); }
function startHarnessDrag(ev, e){ ev.stopPropagation(); selected="harness:"+e.side+":"+e.ref;
  const pos=harnessPos(e); const s=svgPoint(ev); dragging={harnessEl:e,ox:pos.x,oy:pos.y,sx:s.x,sy:s.y,kind:"harness"}; try{stage.setPointerCapture(ev.pointerId);}catch{} renderProps(); render(); }
stage.addEventListener("pointermove",(ev)=>{
  // The half-drawn cable follows the pointer.
  if(!dragging && wiring() && pendingPin){ ghostAt=svgPoint(ev); render(); return; }
  if(!dragging)return; const p=svgPoint(ev);
  let nx=dragging.ox+(p.x-dragging.sx), ny=dragging.oy+(p.y-dragging.sy);
  if(document.getElementById("snap").checked){ nx=Math.round(nx/5)*5; ny=Math.round(ny/5)*5; }
  if(dragging.kind==="pin"){ dragging.pin.x=Math.round(nx); dragging.pin.y=Math.round(ny); }
  else if(dragging.kind==="harness"){ setHarnessPos(dragging.harnessEl,nx,ny); }
  else { dragging.comp.x=Math.round(nx); dragging.comp.y=Math.round(ny); }
  render(); syncJsonBox(); renderProps(); });
stage.addEventListener("pointerup",()=>{ dragging=null; });
stage.addEventListener("pointerdown",()=>{ cancelWire(); selected=null; renderProps(); render(); });
document.getElementById("wiremode").addEventListener("change",()=>{
  cancelWire(); selected=null;
  document.body.classList.toggle("wiring", wiring());
  status(wiring() ? "מצב חיווט: לחץ על פין, ואז על הפין השני. לחיצה על כבל בוחרת אותו (Delete מוחק)." : "");
  renderProps(); render();
});
document.addEventListener("keydown",(ev)=>{
  if(ev.key==="Escape" && pendingPin){ cancelWire(); status("בוטל"); render(); renderProps(); return; }
  const tag=(ev.target&&ev.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea") return;
  if((ev.key==="Delete"||ev.key==="Backspace") && selected && selected.startsWith("wire:")){
    ev.preventDefault(); deleteWire(+selected.slice(5));
  }
});

// ---- props ----
function renderProps(){
  const host=document.getElementById("props"); host.innerHTML="";
  if(!doc){ host.innerHTML='<p class="hint">אין מסמך.</p>'; return; }
  if(!selected){ host.innerHTML = wiring()
      ? '<p class="hint">מצב חיווט: לחץ על פין ואז על הפין השני כדי למתוח כבל. Esc מבטל. לחיצה על כבל קיים בוחרת אותו, ואז אפשר למחוק אותו (Delete).</p>'
      : '<p class="hint">בחר רכיב או פין. גרירה מזיזה. סמן "מנגנוני בדיקה" כדי להזיז ממירים/מנורות. סמן "חיווט" כדי למתוח כבלים.</p>'; return; }
  const add0=(h)=>{ const d=document.createElement("div"); d.innerHTML=h; while(d.firstChild)host.appendChild(d.firstChild); };
  // A selected cable: what it joins, and the way to remove it.
  if(selected.startsWith("wire:")){ const i=+selected.slice(5); const w=doc.wires[i]; if(!w){host.innerHTML="";return;}
    const a=absPin(w.a), b=absPin(w.b);
    add0(`<div class="badge">חיבור · ${esc(w.a)} ↔ ${esc(w.b)}${a&&(a.w||1)>1?(" ["+a.w+"]"):""}</div>`);
    add0(`<button class="ghost" id="wp-del" style="margin-top:10px">מחק חיבור</button>`);
    document.getElementById("wp-del").onclick=()=>deleteWire(i);
    return;
  }
  // A frame pin (position is relative to the frame centre; width fixed).
  if(selected.startsWith("pin:")){ const p=(doc.frame.pins||[]).find(pp=>pp.id===selected.slice(4)); if(!p){host.innerHTML="";return;}
    add0(`<div class="badge">פין · ${esc(p.id)}${p.w>1?(" ["+p.w+"]"):""}</div>`);
    add0(`<div class="row"><div><label>X (יחסי למסגרת)</label><input type="number" id="pp-x" value="${p.x}"></div><div><label>Y (יחסי למסגרת)</label><input type="number" id="pp-y" value="${p.y}"></div></div>`);
    document.getElementById("pp-x").oninput=e=>{p.x=+e.target.value||0;render();syncJsonBox();};
    document.getElementById("pp-y").oninput=e=>{p.y=+e.target.value||0;render();syncJsonBox();};
    if(p.id.includes("Ext")){ add0(`<label>כיתוב</label><input type="text" id="pp-l" value="${esc(p.label||"")}">`);
      document.getElementById("pp-l").oninput=e=>{p.label=e.target.value;render();syncJsonBox();}; }
    return;
  }
  // A check mechanism (harness) — absolute position, stored per pin ref.
  if(selected.startsWith("harness:")){ const e=harnessElements().find(x=>("harness:"+x.side+":"+x.ref)===selected); if(!e){host.innerHTML="";return;}
    const pos=harnessPos(e); const kindHe={"conv-out":"ממיר עשרוני→בינארי","conv-in":"ממיר בינארי→עשרוני","split":"מפצל בקרה","lamp":"מנורה"}[e.kind]||e.kind;
    add0(`<div class="badge">מנגנון בדיקה · ${kindHe} · ${esc(e.ref)} [${e.w}]</div>`);
    add0(`<div class="row"><div><label>X</label><input type="number" id="hp-x" value="${pos.x}"></div><div><label>Y</label><input type="number" id="hp-y" value="${pos.y}"></div></div>`);
    document.getElementById("hp-x").oninput=ev=>{setHarnessPos(e,+ev.target.value||0,harnessPos(e).y);render();syncJsonBox();};
    document.getElementById("hp-y").oninput=ev=>{setHarnessPos(e,harnessPos(e).x,+ev.target.value||0);render();syncJsonBox();};
    add0(`<p class="hint" style="margin-top:8px">אַפֵּס למיקום ברירת המחדל:</p><button class="ghost" id="hp-reset">איפוס</button>`);
    document.getElementById("hp-reset").onclick=()=>{ if(doc.harness&&doc.harness[e.side]) delete doc.harness[e.side][e.ref]; render();syncJsonBox();renderProps(); };
    return;
  }
  const isFrame=selected==="frame"; const c=isFrame?doc.frame:findComp(selected); if(!c){host.innerHTML="";return;}
  const add=(h)=>{ const d=document.createElement("div"); d.innerHTML=h; while(d.firstChild)host.appendChild(d.firstChild); };
  add(`<div class="badge">${isFrame?("מסגרת · "+(c.type||"")):(esc(c.id)+" · "+esc(c.type))}</div>`);
  add(`<div class="row"><div><label>X</label><input type="number" id="p-x" value="${c.x}"></div><div><label>Y</label><input type="number" id="p-y" value="${c.y}"></div></div>`);
  document.getElementById("p-x").oninput=e=>{c.x=+e.target.value||0;render();syncJsonBox();};
  document.getElementById("p-y").oninput=e=>{c.y=+e.target.value||0;render();syncJsonBox();};
  if(isFrame){
    add(`<div class="row"><div><label>רוחב מסגרת</label><input type="number" id="p-fw" value="${c.frameW||600}"></div><div><label>גובה מסגרת</label><input type="number" id="p-fh" value="${c.frameH||420}"></div></div>`);
    document.getElementById("p-fw").oninput=e=>{c.frameW=+e.target.value||600;render();syncJsonBox();};
    document.getElementById("p-fh").oninput=e=>{c.frameH=+e.target.value||420;render();syncJsonBox();};
    add(`<label>כיתובי פינים</label>`);
    for(const p of (c.pins||[])){ const id="pl-"+p.id;
      add(`<div class="pin-row"><span class="pid">${p.id}${p.w>1?(" ["+p.w+"]"):""}</span><input type="text" id="${id}" value="${esc(p.label||"")}"></div>`);
      document.getElementById(id).oninput=e=>{p.label=e.target.value;render();syncJsonBox();}; }
  } else if(c.type==="splitter"){
    add(`<div class="row"><div><label>רגליים</label><input type="number" id="p-out" min="2" max="16" value="${c.outputs||4}"></div><div><label>רוחב</label><input type="number" id="p-w" min="1" value="${c.width||1}"></div></div>`);
    add(`<label class="toggle" style="margin-top:8px"><input type="checkbox" id="p-mir" ${c.mirrored?"checked":""}> ממוראה (מאחד)</label>`);
    document.getElementById("p-out").oninput=e=>{c.outputs=Math.min(16,Math.max(2,+e.target.value||2));render();syncJsonBox();};
    document.getElementById("p-w").oninput=e=>{c.width=Math.max(1,+e.target.value||1);render();syncJsonBox();};
    document.getElementById("p-mir").onchange=e=>{c.mirrored=e.target.checked;render();syncJsonBox();};
  }
}

// ---- json io ----
function syncJsonBox(){ document.getElementById("json-box").value=JSON.stringify(doc,null,2); }
function loadDoc(o){ doc=o; selected=null; dragging=null;
  doc.frame=doc.frame||{id:"task-card-1",type:"taskCard",x:560,y:360,frameW:600,frameH:420,pins:[]};
  doc.frame.id=doc.frame.id||"task-card-1"; doc.external=doc.external||[]; doc.components=doc.components||[]; doc.wires=doc.wires||[];
  render(); renderProps(); syncJsonBox();
  status(`נטען: ${doc.task||"?"} · ${doc.components.length} רכיבים · ${doc.wires.length} חיבורים`); }
function status(s){ document.getElementById("status").textContent=s; }
document.getElementById("showcheck").onchange=()=>{ if(selected&&selected.startsWith("harness:"))selected=null; render(); renderProps(); };
document.getElementById("btn-load").onclick=()=>document.getElementById("file").click();
document.getElementById("file").onchange=(e)=>{ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=()=>{try{loadDoc(JSON.parse(r.result));}catch(err){status("שגיאת JSON: "+err.message);}}; r.readAsText(f); };
document.getElementById("btn-apply").onclick=()=>{ try{loadDoc(JSON.parse(document.getElementById("json-box").value));}catch(err){status("שגיאת JSON: "+err.message);} };
document.getElementById("btn-copy").onclick=async()=>{ syncJsonBox(); try{await navigator.clipboard.writeText(document.getElementById("json-box").value); status("הועתק.");}catch{status("סמן ידנית להעתקה.");} };
document.getElementById("btn-save").onclick=()=>{ syncJsonBox(); const b=new Blob([document.getElementById("json-box").value],{type:"application/json"}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=(doc.task||"solution")+".json"; a.click(); };
// Emit assets/solutions/solutions.js — the whole embedded bundle with the doc
// currently open merged in — so the game reads the edit from file:// (no rebuild
// step / no server needed). Mirrors tools/build-solutions.js output exactly.
document.getElementById("btn-bundle").onclick=()=>{
  syncJsonBox();
  const all=Object.assign({}, window.EMBEDDED_SOLUTIONS||{});
  if(doc&&doc.task) all[doc.task]=doc;
  const banner="// AUTO-GENERATED from assets/solutions/*.json — do not edit by hand.\n"
    +"// Regenerate with: node tools/build-solutions.js (or the editor's “שמור חבילה” button).\n"
    +"// Lets the solution docs load from file:// (no server), where fetch() is blocked.\n";
  const text=banner+"window.EMBEDDED_SOLUTIONS = "+JSON.stringify(all,null,2)+";\n";
  const b=new Blob([text],{type:"application/javascript"}); const a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="solutions.js"; a.click();
  status("נשמרה חבילה: solutions.js ("+Object.keys(all).length+" פתרונות: "+Object.keys(all).join(", ")+"). החלף בה את assets/solutions/solutions.js");
};
