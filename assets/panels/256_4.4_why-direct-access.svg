       stroke="none" xml:space="preserve"><tspan x="1413.5" y="80" id="tspan1">הסיבה שזה כל-כך פשוט היא זה שמראש דאגנו</tspan><tspan x="1413.5" y="130.5" id="tspan2">שזיכרון התוכנה היה בעל גישה ישירה ושנגש</tspan><tspan x="1413.5" y="181" id="tspan3">אליו באמצעות רגיסטר.</tspan><tspan x="1413.5" y="231.5" id="tspan4"> </tspan><tspan x="1413.5" y="282" id="tspan5">למעשה, הסיבה המרכזית שעשינו את זה הייתה</tspan><tspan x="1413.5" y="332.5" id="tspan6">לאפשר קפיצה מותנת. אחרת היה אפשר להשתמש</tspan><tspan x="1413.5" y="383" id="tspan7">בסרט מנוקב עם הפקודות ולבצע אותם אחת-אחת.</tspan></text>
