     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="964.00000"
       y="112.00000">מצוין, בנית ALU, זאת לא סתם מכונה שעושה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="964.00000"
       y="164.62000">חישוב אחד אלא ממש מכונה שאפשר להגיד לה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="964.00000"
       y="217.24000">איזה חישוב היא תעשה. היא עדיין לא מחשב</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="964.00000"
       y="269.86000">שיכול לעשות חישובים רב שלביים אבל זאת</tspan><tspan
