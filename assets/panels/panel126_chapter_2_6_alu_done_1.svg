       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="868.52075"
         y="112">מצוין, בנית ALU, זאת לא סתם מכונה שעושה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="868.52075"
         y="164.62166">חישוב אחד, אלא ממש מכונה שאפשר להגיד לה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="868.52075"
         y="217.24332">איזה חישוב היא תעשה. היא עדיין לא מחשב</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="868.52075"
         y="269.86499">שיכול לעשות חישובים רב שלביים אבל זאת</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="868.52075"
