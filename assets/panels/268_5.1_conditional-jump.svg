    <text id="bubble-text" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">הרבה פעמים אנחנו לא באמת רוצים שהלולאה</tspan><tspan x="1392" y="130.5" id="tspan2">תימשך עד אינסוף. לכן במקום לבצע קפיצה</tspan><tspan x="1392" y="181" id="tspan3">בסוף לולאה לתחילתה, אנחנו נוכל לבצע קפיצה</tspan><tspan x="1392" y="231.5" id="tspan4">מותנית. נבדוק תנאי מסוים ונקפוץ לתחילת</tspan><tspan x="1392" y="282" id="tspan5">הלולאה רק אם הוא מתקיים. אם לא נמשיך</tspan><tspan x="1392" y="332.5" id="tspan6">הלאה ובכך נסיים את הלולאה. זה אומר</tspan><tspan x="1392" y="383" id="tspan7">שהלולאה בפועל תתקיים מספר מסוים של</tspan><tspan x="1392" y="433.5" id="tspan8">פעמים, ואז התוכנה תמשיך.</tspan></text>
  </g>
