    <path id="speech-bubble" d="M 709.51169,40 H 1400.48831 C 1413.49611,40 1420,47.33333 1420,62 V 441.5 C 1420,456.16667 1413.4961,463.5 1400.48831,463.5 H 709.51169 C 696.50389,463.5 690,456.16667 690,441.5 V 264.75 L 606,294 L 690,238.75 V 62 C 690,47.33333 696.50389,40 709.51169,40 Z" fill="#ffffff" stroke="#000000"
