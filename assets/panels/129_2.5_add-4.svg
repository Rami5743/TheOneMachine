     x="906.09186"
     y="103.86530"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="906.09186"
       y="103.86530">יש רק בעיה קטנה אחת: סכום של שני מספרים 16 ספרתיים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="906.09186"
       y="159.57617">הוא לעיתים 17 ספרתי. אנחנו נתעלם מהספרה המובילה, כי</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="906.09186"
       y="215.28703">במחשב כל החיבורים קבועים, ואנחנו לא יכולים להרחיב</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="906.09186"
       y="270.99789">אותם עד אינסוף. כל עוד כל המספרים המעורבים (כולל</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="906.09186"
       y="326.70877">התוצאה) לא יעלו על 64,000, זה יהיה בסדר. אם נעבור את</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="906.09186"
       y="382.41962">הגודל המותר זה יוביל לתקלה שנקראת גלישה נומרית</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="906.09186"
       y="438.13049">(Integer overflow). ננסה להימנע מזה...</tspan></text>
