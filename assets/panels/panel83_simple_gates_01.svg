    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34.2662px;line-height:1.2069;font-family:'Noto Sans Hebrew', Arial, sans-serif;-inkscape-font-specification:'Noto Sans Hebrew, Normal';text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="913.57074"
     y="83.59426"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="tspan1"
       x="913.57074"
       y="83.59426">אני רואה שאתם נהנים, אבל אין לנו זמן לשטויות האלה.</tspan><tspan
       sodipodi:role="line"
       id="tspan2"
       x="913.57074"
       y="124.95006">אנחנו צריכים להכין כרטיסים. הרבה כרטיסים. הכרטיסים</tspan><tspan
       sodipodi:role="line"
       id="tspan3"
       x="913.57074"
       y="166.30586">מורכבים מכמה Nand-ים שמחוברים יחד כדי לבצע פעולה</tspan><tspan
       sodipodi:role="line"
       id="tspan4"
       x="913.57074"
       y="207.66166">מסוימת. אתה יכול לחבר יציאה של Nand אחד לכניסה של</tspan><tspan
       sodipodi:role="line"
       id="tspan5"
       x="913.57074"
       y="249.01746">Nand אחר, אבל אל תחבר יציאה ליציאה או כניסה</tspan><tspan
       sodipodi:role="line"
       id="tspan6"
       x="913.57074"
       y="290.37326">לכניסה, שלא תשרוף לי אותם. אתה יכול לחבר אותה</tspan><tspan
       sodipodi:role="line"
       id="tspan7"
       x="913.57074"
       y="331.72906">יציאה ליותר מכבל אחד, אבל אל תכניס 2 כבלים לאותה</tspan><tspan
       sodipodi:role="line"
       id="tspan8"
       x="913.57074"
       y="373.08486">הכניסה. לכל כרטיס יש כניסות ויציאות משלו שמתחברות</tspan><tspan
       sodipodi:role="line"
       id="tspan9"
       x="913.57074"
       y="414.44066">ל-Nand-ים בפנים. אתה יכול להשתמש בכמה Nand-ים</tspan><tspan
       sodipodi:role="line"
       id="tspan10"
       x="913.57074"
       y="455.79646">שאתה צריך. יש לנו מספיק במחסן. רק אף מילה לאף</tspan><tspan
       sodipodi:role="line"
       id="tspan11"
       x="913.57074"
       y="497.15226">אחד. כשאתה גומר כרטיס אתה יכול להשתמש בו</tspan><tspan
       sodipodi:role="line"
       id="tspan12"
       x="913.57074"
       y="538.50806">בכרטיסים אחרים שאתה מכין, כמו שאתה משתמש</tspan><tspan
       sodipodi:role="line"
       id="tspan13"
       x="913.57074"
       y="579.86386">ב-Nand. אתה לא צריך להכין אותו כל פעם מחדש, פשוט</tspan><tspan
       sodipodi:role="line"
       id="tspan14"
       x="913.57074"
       y="621.21966">תסמן באיזה כרטיס אתה משתמש. יש לי אנשים שידאגו</tspan><tspan
       sodipodi:role="line"
       id="tspan15"
       x="913.57074"
       y="662.57546">לזה, רק הם לא צריכים לדעת שזה בא ממך.</tspan></text>
  </g>
