    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="893.90884"
       y="82"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="893.90884"
         y="82.0000">מצוין, עכשיו יש לנו את כל הזיכרון שאנחנו צריכים ביחד</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="893.90884"
         y="132.5002">עם הפורטים. יש רק בעיה אחת, אין לנו אותו. יש לנו רק</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="893.90884"
         y="183.0004">תכנון. כל פעם שאתה משתמש בכרטיס שכבר בנית, אתה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="893.90884"
         y="233.5006">רק מסמן, ומישהו צריך להרכיב. קודם היית יכול לדחוף</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="893.90884"
         y="284.0008">את זה לאנשים שבונים מכונות חישוב בלי שהם ישימו לב.</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="893.90884"
         y="334.5010">אבל פה מדובר בכרטיס עצום. הם ישימו לב...</tspan></text>
