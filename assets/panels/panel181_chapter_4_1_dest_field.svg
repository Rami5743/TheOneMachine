       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="925"
         y="70">‏2 הביטים הבאים אומרים לאן אנחנו רושמים את התוצאה של</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="925"
         y="120.5">חישוב ה-ALU. הם מייצגים מספר בינרי בין 0 ל-3 שלפיו</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="925"
         y="171">מחליטים:</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="1386"
         style="text-align:start;text-anchor:start"
         y="221.501">‏0. לא רושמים כלל. סתם מחשבים ומתעלמים מהתוצאה. פקודה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="1386"
         style="text-align:start;text-anchor:start"
         y="272.001">מיותרת אבל אפשרית</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="1386"
         style="text-align:start;text-anchor:start"
