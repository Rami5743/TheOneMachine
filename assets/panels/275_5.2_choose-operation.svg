       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">מצויין. נראה שהכל עובד. עכשיו אנחנו</tspan><tspan x="1392" y="130.5" id="tspan2">רוצים להדגים שהמכונה שלנו יכולה</tspan><tspan x="1392" y="181" id="tspan3">לעשות הרבה דברים שונים. אנחנו רוצים</tspan><tspan x="1392" y="231.5" id="tspan4">לאפשר לבחור איזה פעולה עושים. נחבר</tspan><tspan x="1392" y="282" id="tspan5">עוד פורט בו נכניס את הפעולה למכונה.</tspan><tspan x="1392" y="332.5" id="tspan6">זה יהיה משהו כמו ה-ALU שלנו אבל עם</tspan><tspan x="1392" y="383" id="tspan7">פעולות מתקדמות יותר, כמו כפל וחילוק.</tspan></text>
