       x="919.65196"
       y="111.98769"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="919.65196"
         y="111.98769">בס הבקרה של ה-ALU נקרא "הוראות", כי הוא מורה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="919.65196"
         y="164.60935">לו איזה חישוב לעשות. ההוראות של ה-ALU שלנו</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="919.65196"
         y="217.23101">מורכבות מ-12 ביטים. הן יכולות לבחור על איזה 2</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="919.65196"
         y="269.85267">מתוך שלוש הכניסות של ה-ALU תתבצע הפעולה. הן</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="919.65196"
         y="322.47433">גם יכולות לבחור שלא תתבצע פעולה כלל ובמקום זה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="919.65196"
         y="375.09599">ה-ALU יוציא את ההוראות עצמן, אבל הכי חשוב, הן</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="919.65196"
         y="427.71765">מאפשרות לבחור בין 64 פעולות ולבצע אותם על שני</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="919.65196"
         y="480.33931">בסים של 16 ביט כל אחד.</tspan></text>
