    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:36.8822px;line-height:1.4500;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="959.50824"
     y="134.05222"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="959.50824"
       y="134.05222">פעולת החשבון הכי בסיסית היא חיבור. אנחנו רוצים לבנות</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="959.50824"
       y="187.53139">כרטיס שמחבר 2 מספרים. הוא יקבל 2 בסים של 16 ביטים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="959.50824"
       y="241.01057">(שמייצגים 2 מספרים) ויוציא בס של 16 ביטים (שמייצג את</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="959.50824"
       y="294.48975">הסכום שלהם). אנחנו נעשה את זה בדיוק כמו שאתה עשית</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="959.50824"
       y="347.96893">כשחישבת סכום של 2 מספרים בטור. השלב הבסיסי הוא לחבר</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="959.50824"
       y="401.44812">2 ספרות. שים לב שהתוצאה יכולה להיות דו ספרתית. יש לה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="959.50824"
       y="454.92731">ספרת אחדות וספרת 2. בספרת האחדות נשתמש כמו שהיא, ואת</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="959.50824"
       y="508.40649">ספרת ה-2 נעביר הלאה לספרה הבאה. קוראים לספרה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="959.50824"
       y="561.88568">שמעבירים הלאה נשיאה ובאנגלית carry.</tspan></text>
