  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 709.51169,40 H 1400.48831 C 1413.49611,40 1420,47.33333 1420,62 V 492 C 1420,506.66667 1413.4961,514 1400.48831,514 H 709.51169 C 696.50389,514 690,506.66667 690,492 V 290 L 606,294 L 690,264 V 62 C 690,47.33333 696.50389,40 709.51169,40 Z" fill="#ffffff" stroke="#000000"
