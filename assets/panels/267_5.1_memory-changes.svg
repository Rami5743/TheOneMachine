    <text id="bubble-text" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">הרבה פעמים אנחנו לא באמת רוצים שהלולאה</tspan><tspan x="1392" y="130.5" id="tspan2">תעשה בדיוק אותו הדבר כל פעם, אלא פעולה</tspan><tspan x="1392" y="181" id="tspan3">דומה. זה קצת בעיה, כי אנחנו לא יכולים לשנות</tspan><tspan x="1392" y="231.5" id="tspan4">את הפקודות שנתנו למחשב אחרי שהרצנו אותו.</tspan><tspan x="1392" y="282" id="tspan5">אבל הפעולות של המחשב משנות את מה שיש</tspan><tspan x="1392" y="332.5" id="tspan6">בזיכרון שלו, ולכן, בכל פעם הפקודות פועלות על</tspan><tspan x="1392" y="383" id="tspan7">דברים אחרים ויכולות להביא לתוצאות שונות,</tspan><tspan x="1392" y="433.5" id="tspan8">כך שבפועל נוכל לקבל משהו חדש בכל פעם</tspan><tspan x="1392" y="484" id="tspan9">שהלולאה תעבור.</tspan></text>
  </g>
