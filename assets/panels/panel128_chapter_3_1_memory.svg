    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="832.00000"
     y="80.00000"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="832.00000"
       y="80.00000">טוב, נפסיק לברבר ונמשיך לעבוד. כדי שהמחשב</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="832.00000"
       y="130.50000">שלנו יוכל לבצע חישובים מסובכים הוא צריך</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="832.00000"
       y="181.00000">אפשרות לזכור את מה שהוא עושה. בשביל זה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="832.00000"
       y="231.50000">הוא צריך זיכרון. עד עכשיו כל הכרטיסים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="832.00000"
       y="282.00000">שבנינו ידעו לבצע חישוב אבל לא ידעו לשמור</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="832.00000"
       y="332.50000">שום דבר. אנחנו צריכים לבנות כרטיסים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="832.00000"
       y="383.00000">שיכולים לשמור משהו. זאת אומרת שחוץ</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="832.00000"
       y="433.50000">מכניסות ויציאות הם יוכלו להימצא גם</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="832.00000"
       y="484.00000">במצבים שונים, ונוכל להעביר אותם ממצב</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line10"
       x="832.00000"
       y="534.50000">למצב על ידי שינוי הכניסות.</tspan></text>
  </g>
