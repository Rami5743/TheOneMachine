       font-family="'Noto Sans Hebrew', Arial, sans-serif"
       font-size="34px"
       font-weight="400"
       fill="#000000"
       stroke="none"
       xml:space="preserve"
       style="stroke-width:0.907271"
       x="-128"
       y="-16"><tspan
         x="832"
         y="80"
         style="stroke-width:0.907271"
         id="tspan1">טוב, נפסיק לברבר ונמשיך לעבוד. כדי שהמחשב</tspan><tspan
         x="832"
         y="130.5"
         style="stroke-width:0.907271"
         id="tspan2">שלנו יוכל לבצע חישובים מסובכים הוא צריך</tspan><tspan
         x="832"
         y="181"
         style="stroke-width:0.907271"
         id="tspan3">אפשרות לזכור את מה שהוא עושה. בשביל זה</tspan><tspan
         x="832"
         y="231.5"
         style="stroke-width:0.907271"
         id="tspan4">הוא צריך זיכרון. עד עכשיו כל הכרטיסים</tspan><tspan
         x="832"
         y="282"
         style="stroke-width:0.907271"
         id="tspan5">שבנינו ידעו לבצע חישוב אבל לא ידעו לשמור</tspan><tspan
         x="832"
         y="332.5"
         style="stroke-width:0.907271"
         id="tspan6">שום דבר. אנחנו צריכים לבנות כרטיסים</tspan><tspan
         x="832"
         y="383"
         style="stroke-width:0.907271"
         id="tspan7">שיכולים לשמור משהו. זאת אומרת שחוץ</tspan><tspan
         x="832"
         y="433.5"
         style="stroke-width:0.907271"
         id="tspan8">מכניסות ויציאות הם יוכלו להימצא גם</tspan><tspan
         x="832"
         y="484"
         style="stroke-width:0.907271"
         id="tspan9">במצבים שונים, ונוכל להעביר אותם ממצב</tspan><tspan
         x="832"
         y="534.5"
         style="stroke-width:0.907271"
         id="tspan10">למצב על ידי שינוי הכניסות.</tspan></text>
