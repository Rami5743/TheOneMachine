       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">דבר אחרון. שים לב שכשאנחנו מחברים את</tspan><tspan x="1392" y="130.5" id="tspan2">הריסט אז הזיכרון והרגיסטרים לא נמחקים.</tspan><tspan x="1392" y="181" id="tspan3">מכיוון שאנחנו מפעילים על המחשב כל מיני</tspan><tspan x="1392" y="231.5" id="tspan4">תוכנות, אנחנו לא יכולים לדעת מה עשו</tspan><tspan x="1392" y="282" id="tspan5">הקודמות, ולכן אנחנו כבר לא יכולים להניח</tspan><tspan x="1392" y="332.5" id="tspan6">שהכל היה במצב 0 לפני שהתוכנה התחילה</tspan><tspan x="1392" y="383" id="tspan7">לרוץ.</tspan></text>
