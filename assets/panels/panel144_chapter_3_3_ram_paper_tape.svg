    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="894.58099"
       y="82"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="894.58099"
         y="82">יש לנו זיכרונות אחרים גדולים וזולים יותר, אבל אין להם את</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="894.58099"
         y="132.5002">התכונה של גישה ישירה. למשל יש לנו סלילי נייר עליהם יש</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="894.58099"
         y="183.0004">שורות שורות של נקבים. 16 מקומות לנקב בכל שורה, אך</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="894.58099"
         y="233.5006">לא כל 16 המקומות מנוקבים. יש לנו מכשיר שאפשר</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="894.58099"
         y="284.0008">להעביר דרכו את הסליל ובכל שורה הוא בודק איפה יש את</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="894.58099"
         y="334.501">הנקבים (לפי איפה שעובר החשמל; הנייר לא נותן לחשמל</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="894.58099"
         y="385.0012">לעבור) ומוציא את המידע הזה לבס של 16 כבלים. אפשר</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="894.58099"
         y="435.5014">להזין את המידע הזה למכונות חישוב כמו ה-ALU למשל.</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line9"
         x="894.58099"
         y="486.0016">אם רוצים לעבור על כל השורות מהתחלה ועד הסוף, זה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line10"
         x="894.58099"
         y="536.5018">אפילו די מהיר (יותר איטי מהזיכרון שלנו, בגלל שזה מכני</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line11"
         x="894.58099"
         y="587.002">ולא חשמלי אבל עדיין סביר). אולם אם רוצים לגשת למקום</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line12"
         x="894.58099"
         y="637.5022">ספציפי זה נהיה בעייתי, צריך לגלגל חלק ניכר מהסליל כדי</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line13"
         x="894.58099"
         y="688.0024">להגיע למקום הרצוי. אם כל פעם רוצים לקפוץ לאיזור אחר</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line14"
         x="894.58099"
         y="738.5026">בסליל זה נהיה לא מעשי בכלל. ב-RAM שלנו לעומת זאת,</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line15"
         x="894.58099"
         y="789.0028">זה פשוט מאוד.</tspan></text>
