    <path
       id="speech-bubble"
       d="M 461.7468,40 H 1327.0871 c 13.57407,0 20.3611,8.4111 20.3611,25.23331 V 730.7693 c 0,16.8222 -6.78703,25.23331 -20.3611,25.23331 H 461.7468 c -13.57407,0 -20.3611,-8.4111 -20.3611,-25.23331 V 142.24899 L 412.31295,155.97445 441.3857,111.13823 V 65.23331 c 0,-16.8222 6.78703,-25.23331 20.3611,-25.23331 z"
       fill="#ffffff"
