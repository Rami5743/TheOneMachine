       d="m 489.99005,40 h 807.83755 c 12.6326,0 18.9487,8.4111 18.9487,25.23331 v 716.03618 c 0,16.8222 -6.3161,25.23331 -18.9487,25.23331 H 489.99005 c -12.63245,0 -18.94867,-8.4111 -18.94867,-25.23331 V 128.20607 l -49.45071,3.34971 49.45071,-20.41755 V 65.23331 C 471.04138,48.41111 477.3576,40 489.99005,40 Z"
