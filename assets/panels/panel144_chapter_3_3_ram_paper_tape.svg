       stroke-linecap="round" />
    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="894.41695"
       y="80"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="894.41695"
         y="80">יש לנו זיכרונות אחרים גדולים וזולים יותר, אבל אין להם את</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="894.41695"
         y="130.5002">התכונה של גישה ישירה. למשל יש לנו סלילי נייר עליהם יש</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="894.41695"
         y="181.0004">שורות שורות של נקבים. 16 מקומות לנקב בכל שורה, אך לא</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="894.41695"
         y="231.5006">כל 16 המקומות מנוקבים. יש לנו מכשיר שאפשר להעביר דרכו</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="894.41695"
         y="282.0008">את הסליל ובכל שורה הוא בודק איפה יש את הנקבים (לפי</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="894.41695"
         y="332.501">איפה שעובר החשמל; הנייר לא נותן לחשמל לעבור) ומוציא</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="894.41695"
         y="383.0012">את המידע הזה לבס של 16 כבלים. אפשר להזין את המידע</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="894.41695"
         y="433.5014">הזה למכונות חישוב כמו ה-ALU למשל. אם רוצים לעבור על</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line9"
         x="894.41695"
         y="484.0016">כל השורות מהתחלה ועד הסוף, זה אפילו די מהיר (יותר איטי</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line10"
         x="894.41695"
         y="534.5018">מהזיכרון שלנו, בגלל שזה מכני ולא חשמלי אבל עדיין סביר).</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line11"
         x="894.41695"
         y="585.002">אולם אם רוצים לגשת למקום ספציפי זה נהיה בעייתי, צריך</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line12"
         x="894.41695"
         y="635.5022">לגלגל חלק ניכר מהסליל כדי להגיע למקום הרצוי. אם כל פעם</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line13"
         x="894.41695"
         y="686.0024">רוצים לקפוץ לאיזור אחר בסליל זה נהיה לא מעשי בכלל.</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line14"
         x="894.41695"
         y="736.5026">ב-RAM שלנו לעומת זאת, זה פשוט מאוד.</tspan></text>
  </g>
</svg>
