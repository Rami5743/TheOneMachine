  <image id="raster-base" x="0" y="0" width="1448" height="1086"
     preserveAspectRatio="none" href="149_3.2_more-memory.jpg" xlink:href="149_3.2_more-memory.jpg" />
  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 490.51169,40 H 1380.48831 C 1393.49611,40 1400,47.33333 1400,62 V 492 C 1400,506.66667 1393.4961,514 1380.48831,514 H 490.51169 C 477.50389,514 471,506.66667 471,492 V 123.23 L 425.47133,129.92 L 471,101.21 V 62 C 471,47.33333 477.50389,40 490.51169,40 Z" fill="#ffffff" stroke="#000000"
       stroke-width="3.44993" stroke-linejoin="round" stroke-linecap="round" />
    <text id="bubble-text" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="935.5" y="80" id="tspan1">מצוין, עכשיו יש לנו זיכרון שבו נוכל לשמור את כל המידע</tspan><tspan x="935.5" y="130.5" id="tspan2">שהמחשב שלנו יצטרך בשביל החישובים (קוראים לזה זיכרון</tspan><tspan x="935.5" y="181" id="tspan3">מידע או זיכרון דאטא). אנחנו עוד צריכים זיכרון שישמור</tspan><tspan x="935.5" y="231.5" id="tspan4">את הפקודות שאנחנו נותנים למחשב. בסופו של דבר, כדי</tspan><tspan x="935.5" y="282" id="tspan5">שהמחשב יבצע את החישובים שאנחנו רוצים הוא צריך לבצע</tspan><tspan x="935.5" y="332.5" id="tspan6">רצף של הוראות (שנקראות פקודות) ואנחנו צריכים מקום נוח</tspan><tspan x="935.5" y="383" id="tspan7">בשביל לשמור אותם כדי שהוא יוכל לקרוא אותם. אולי פעם</tspan><tspan x="935.5" y="433.5" id="tspan8">נלמד להשתמש ב-RAM גם למטרה הזאת. כרגע, יותר פשוט לנו</tspan><tspan x="935.5" y="484" id="tspan9">להפריד בין זיכרון התוכנה לזיכרון הדאטה.</tspan></text>
  </g>
</svg>
