  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 490.51169,40 H 1380.48831 C 1393.49611,40 1400,47.33333 1400,62 V 391 C 1400,405.66667 1393.4961,413 1380.48831,413 H 490.51169 C 477.50389,413 471,405.66667 471,391 V 123.23 L 425.47133,129.92 L 471,101.21 V 62 C 471,47.33333 477.50389,40 490.51169,40 Z" fill="#ffffff" stroke="#000000"
