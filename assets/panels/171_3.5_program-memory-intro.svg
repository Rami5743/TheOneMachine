    <text id="bubble-text" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="935.5" y="80" id="tspan1">מצוין, עכשיו יש לנו זיכרון שבו נוכל לשמור את כל המידע</tspan><tspan x="935.5" y="130.5" id="tspan2">שהמחשב שלנו יצטרך בשביל החישובים. אנחנו עוד צריכים</tspan><tspan x="935.5" y="181" id="tspan3">זיכרון שישמור את הפקודות שאנחנו נותנים למחשב. בסופו</tspan><tspan x="935.5" y="231.5" id="tspan4">של דבר, כדי שהמחשב יבצע את החישובים שאנחנו רוצים הוא</tspan><tspan x="935.5" y="282" id="tspan5">צריך לבצע רצף של הוראות (שנקראות פקודות) ואנחנו</tspan><tspan x="935.5" y="332.5" id="tspan6">צריכים מקום נוח בשביל לשמור אותם כדי שהוא יוכל</tspan><tspan x="935.5" y="383" id="tspan7">לקרוא אותם.</tspan></text>
  </g>
