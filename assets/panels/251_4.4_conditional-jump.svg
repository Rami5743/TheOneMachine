  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 719.51169,40 H 1400.48831 C 1413.49611,40 1420,47.33333 1420,62 V 391 C 1420,405.66667 1413.4961,413 1400.48831,413 H 719.51169 C 706.50389,413 700,405.66667 700,391 V 379 L 614,300 L 700,356.98 V 62 C 700,47.33333 706.50389,40 719.51169,40 Z" fill="#ffffff" stroke="#000000"
       stroke-width="3.44993" stroke-linejoin="round" stroke-linecap="round" />
    <text id="bubble-text" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1060" y="80" id="tspan1">מתברר שכל מה שצריך להוסיף למכונה שלנו כדי</tspan><tspan x="1060" y="130.5" id="tspan2">שתוכל לבצע כל חישוב, זה מה שנקרא "יכולת</tspan><tspan x="1060" y="181" id="tspan3">קפיצה מותנת". זה אומר שצריך להוסיף פקודה</tspan><tspan x="1060" y="231.5" id="tspan4">שאומרת שבמקום לבצע את הפקודה הבאה המכונה</tspan><tspan x="1060" y="282" id="tspan5">תקפוץ למקום אחר בתוכנה ותמשיך משם. יתר על</tspan><tspan x="1060" y="332.5" id="tspan6">כן, צריך לאפשר למכונה "להחליט" האם היא עושה</tspan><tspan x="1060" y="383" id="tspan7">את זה, לפי תוצאת החישוב.</tspan></text>
  </g>
