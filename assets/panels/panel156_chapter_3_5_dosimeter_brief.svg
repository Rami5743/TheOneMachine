       x="894.58099"
       y="82"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="894.58099"
         y="82.0000">קח את זה. כל כמה דקות תצטרך להציץ בעינית ולבדוק את</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="894.58099"
         y="132.5002">המד. אם המספר שם מעל ל-100, תפסיק מיד הכול ולך</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="894.58099"
         y="183.0004">הביתה עד למחרת. אם מאיזושהי סיבה הוא הגיע</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="894.58099"
         y="233.5006">למקסימום (200) עזוב הכל ורוץ מיד אלי. אם אני לא</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="894.58099"
         y="284.0008">במשרד תבוא למגורים שלי. לא חשוב מה השעה. תעיר</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="894.58099"
         y="334.5010">אותי אם צריך. בוא נקווה שזה לא יקרה.</tspan></text>
