    <text id="bubble-text" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">בשביל זה נצטרך לגרום למכונה לעבוד</tspan><tspan x="1392" y="130.5" id="tspan2">באופן שונה במקרים שונים. זה עוד מקרה</tspan><tspan x="1392" y="181" id="tspan3">שבו נשתמש בקפיצה מותנית. נניח שיש</tspan><tspan x="1392" y="231.5" id="tspan4">לנו 2 מקרים שבכל אחד מהם אנחנו רוצים</tspan><tspan x="1392" y="282" id="tspan5">לעשות משהו אחר. אנחנו יכולים לעשות</tspan><tspan x="1392" y="332.5" id="tspan6">חישוב שבודק האם אנחנו במקרה הראשון</tspan><tspan x="1392" y="383" id="tspan7">ואם כן אז לקפוץ למקום שבו עושים את</tspan><tspan x="1392" y="433.5" id="tspan8">המקרה הראשון. אם לא, להמשיך ולעשות</tspan><tspan x="1392" y="484" id="tspan9">את השני. בסוף צריך לזכור לדלג מעל</tspan><tspan x="1392" y="534.5" id="tspan10">המקרה הראשון אם עשינו את השני כדי לא</tspan><tspan x="1392" y="585" id="tspan11">לעשות את שניהם.</tspan></text>
  </g>
</svg>
