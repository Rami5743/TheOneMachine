       x="1394"
       y="78"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="1394"
         y="78">הפקודות יהיו רשומות בזיכרון. כדי להקל על</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="1394"
         y="128.5">העבודה, הזיכרון שלנו יהיה מחולק ל-2</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="1394"
         y="179">חלקים:</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="1394"
         y="229.501">• זיכרון דאטה (בקיצור "הזיכרון") — זה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="1364.41"
         y="280.001">כרטיס ה-RAM שבנית — הוא יכיל את המידע</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="1364.41"
         y="330.501">שעליו אנחנו רוצים לבצע את החישובים</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="1394"
         y="381.001">• זיכרון תוכנה — זה יהיה עוד כרטיס</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="1364.41"
         y="431.501">RAM1024 שעליו תישמר רשימת הפקודות</tspan></text>
