    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="894.58099"
       y="82"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="894.58099"
         y="82">ל-RAM יש עוד יתרון, אפשר לכתוב לתוכו בקלות ולא רק</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="894.58099"
         y="132.5002">לקרוא ממנו. החיסרון המרכזי של ה-RAM הוא שהוא יקר</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="894.58099"
         y="183.0004">וקשה ליצור, לכן אנחנו נאלצים להסתפק ב-1000 רגיסטרים.</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="894.58099"
         y="233.5006">ל-RAM יש עוד חיסרון - אם מנתקים אותו מהחשמל הכל</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="894.58099"
         y="284.00079">הופך ל-0 כי אין מטען בשום מקום. לכן אומרים שזה זיכרון</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="894.58099"
         y="334.50098">נדיף - המידע מתנדף ממנו. זה לא מאוד מפריע לנו כי גם כך</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="894.58099"
         y="385.00119">ה-RAM שלנו קטן מדי כדי לשמור בו דברים חשובים לאורך</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="894.58099"
         y="435.50137">זמן. אנחנו נשתמש בו רק בשביל שהמחשב יוכל לעשות</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line9"
         x="894.58099"
         y="486.00159">חישובים.</tspan></text>
