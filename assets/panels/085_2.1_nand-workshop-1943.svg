    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:29.6664px;line-height:1.1852;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="799.66162"
     y="240.40985"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="799.66162"
       y="240.40985">עכשיו, בשנת 1943, אני די גדול,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="799.66162"
       y="275.56998">אבל בעוד מספר שנים יופיעו טריודות חדשות,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="799.66162"
       y="310.73007">שמבוססות על מוליכים למחצה ולא על שפופרות ריק.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="799.66162"
       y="345.89017">הן נקראות טרנזיסטורים. הן הרבה יותר קטנות,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="799.66162"
       y="381.05026">כך שגם אני אקטן בהרבה, ואהפוך גם למהיר בהרבה.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="799.66162"
       y="416.21036">עם השנים אני אהפוך לקטן ומהיר עוד יותר, כך שעד</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="799.66162"
       y="451.37045">סוף המאה ה-20 אני אהיה כל כך קטן שאפשר יהיה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="799.66162"
       y="486.53058">לראות אותי רק במיקרוסקופ. זה חשוב, כי צריך</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="799.66162"
       y="521.69067">אלפים ממני כדי לבנות מחשב פשוט, ומיליונים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line10"
       x="799.66162"
       y="556.85077">בשביל מחשב של המאה ה-21.</tspan></text>
