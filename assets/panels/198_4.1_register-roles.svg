       x="1394"
       y="78"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="1394"
         y="78">לכל רגיסטר של המעבד יהיה תפקיד מוגדר</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="1394"
         y="128.5">למדי:</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="1394"
         y="179">• רגיסטר A יכיל כתובת בזיכרון הדאטה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="1364.41"
         y="229.5">שאליה נרצה לכתוב וממנה נרצה לקרוא.</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="1364.41"
         y="280">אנחנו גם נשתמש בו לעוד דברים</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="1394"
         y="330.5">• רגיסטר D יכיל מידע שהמעבד יוכל לעבוד</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="1364.41"
         y="381">עליו באופן ישיר</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="1394"
         y="431.5">• הרגיסטר PC (קיצור של</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line9"
         x="1364.41"
         y="482">Program counter; בעברית: מונה תוכנה)</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line10"
         x="1364.41"
         y="532.5">יכיל את הכתובת בזיכרון התוכנה של</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line11"
         x="1364.41"
         y="583">הפקודה אותה המעבד צריך לבצע</tspan></text>
