       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">האפשרות של קפיצה מותנת תהפוך את המכונה</tspan><tspan x="1392" y="130.5" id="tspan2">שלנו להרבה יותר חזקה, אבל לא קשה להוסיף</tspan><tspan x="1392" y="181" id="tspan3">אותה: עיקר ההבדל הוא ב-PC וביחידת הבקרה.</tspan><tspan x="1392" y="231.5" id="tspan4">צריך להוסיף כניסה ל-PC שתאפשר לכתוב</tspan><tspan x="1392" y="282" id="tspan5">לתוכו, במקום שהוא יגדל סתם ב-1. זה יאפשר</tspan><tspan x="1392" y="332.5" id="tspan6">לנו לקפוץ. צריך גם להרחיב את יחידת הבקרה</tspan><tspan x="1392" y="383" id="tspan7">כדי שהיא תוכל לפתוח את ה-PC לכתיבה מתי</tspan><tspan x="1392" y="433.5" id="tspan8">שצריך.</tspan></text>
