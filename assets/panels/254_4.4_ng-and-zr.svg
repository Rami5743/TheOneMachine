       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">אתה זוכר, שמבחינתנו, מספר הוא שלילי אם הביט</tspan><tspan x="1392" y="130.5" id="tspan2">הראשון שלו הוא 1. אתה גם בטח זוכר שה-ALU4</tspan><tspan x="1392" y="181" id="tspan3">בדיוק מוציא 2 כבלים שאומרים לנו האם החישוב</tspan><tspan x="1392" y="231.5" id="tspan4">יצא 0 והאם הוא יצא שלילי, כך שאתה יכול</tspan><tspan x="1392" y="282" id="tspan5">להשתמש בו.</tspan></text>
