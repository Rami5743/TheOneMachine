  <g
     id="text-bubble-layer"
     inkscape:groupmode="layer"
     inkscape:label="Text bubble">
    <path
       id="speech-bubble"
       d="m 638.94867,40 h 742.10266 c 12.6326,0 18.9487,8.4111 18.9487,25.23331 v 362.53478 c 0,16.8222 -6.3161,25.23331 -18.9487,25.23331 H 638.94867 c -12.63245,0 -18.94867,-8.4111 -18.94867,-25.23331 V 128.20607 l -49.45071,3.34971 49.45071,-20.41755 V 65.23331 C 620.00000,48.41111 626.31622,40 638.94867,40 Z"
       fill="#ffffff"
       stroke="#000000"
       stroke-width="3.44993"
       stroke-linejoin="round"
       stroke-linecap="round"
       sodipodi:nodetypes="ssssssscccss" />
    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="1010.0"
       y="82"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="1010.0"
         y="82.0000">כמו שאתה רואה יש כאן הרבה מקום. תוכל לבנות כאן</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="1010.0"
         y="132.5002">את הזיכרון בנחת. אנסה להביא לך רגיסטרים מוכנים</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="1010.0"
         y="183.0004">מדי פעם. תתחיל מלבנות את הפורטים ואת המסגרת</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="1010.0"
         y="233.5006">הכללית, ואז למלא אותה ברגיסטרים. תתחיל</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="1010.0"
         y="284.0008">מכתובת 0 ותתקדם משם. כך שאם נראה שאנחנו לא</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="1010.0"
         y="334.5010">יכולים לבנות הכל בזמן סביר, יהיה לנו זיכרון מתפקד</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="1010.0"
         y="385.0012">קטן יותר, שנוכל להשתמש בו להדגמות, ובהמשך</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="1010.0"
         y="435.5014">כשנקבל עוד אנשים נוכל להשלים אותו.</tspan></text>
  </g>
