<!-- Chapter 3.5, inside the hangar: room to build the memory, shelving to lay it out on, and the order of work. Bubble geometry as hand-drawn on panel162; this speech is long, so its bubble runs wider (to x 1400). -->
<svg
   version="1.1"
   width="1448"
   height="1086"
   viewBox="0 0 1448 1086"
   preserveAspectRatio="xMidYMid meet"
   id="svg1"
   inkscape:version="1.4 (86a8ad7, 2024-10-11)"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs1" />
  <sodipodi:namedview
     id="namedview1"
     pagecolor="#ffffff"
     bordercolor="#000000"
     borderopacity="0.25"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="1"
     inkscape:cx="798.5"
     inkscape:cy="287.5"
     inkscape:window-maximized="1"
     inkscape:current-layer="text-bubble-layer" />
  <image
     id="raster-base"
     x="0"
     y="0"
     width="1448"
     height="1086"
     preserveAspectRatio="none"
     href="panel160_chapter_3_5_hangar.jpg"
     xlink:href="panel160_chapter_3_5_hangar.jpg" />
  <g
     id="text-bubble-layer"
     inkscape:groupmode="layer"
     inkscape:label="Text bubble">
    <path
       id="speech-bubble"
       d="m 596.80571,238 h 787.05549 c 10.7593,0 16.1388,8.4111 16.1388,25.23331 v 463.53518 c 0,16.8222 -5.3795,25.23331 -16.1388,25.23331 H 596.80571 c -10.75917,0 -16.13875,-8.4111 -16.13875,-25.23331 v -400.56242 l -57.11762,10.34971 57.11762,-27.41755 v -45.90492 c 0,-16.8222 5.37958,-25.23331 16.13875,-25.23331 z"
       fill="#ffffff"
       stroke="#000000"
       stroke-width="3.44993"
       stroke-linejoin="round"
       stroke-linecap="round"
       sodipodi:nodetypes="ssssssscccss" />
    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="990.333"
       y="278"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="990.333"
         y="278">כמו שאתה רואה, יש כאן הרבה מקום. תוכל לבנות</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="990.333"
         y="328.5">כאן את הזיכרון בנחת. אנסה להביא לך רגיסטרים</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="990.333"
         y="379">מוכנים מדי פעם. אני אביא לך גם כונניות שתוכל</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="990.333"
         y="429.501">לסדר עליהן את מה שאתה בונה. תתחיל מלבנות את</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="990.333"
         y="480.001">הפורטים ואת המסגרת הכללית, ואז למלא אותה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="990.333"
         y="530.501">ברגיסטרים. תתחיל מכתובת 0 ותתקדם משם, כך</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="990.333"
         y="581.001">שאם נראה שאנחנו לא יכולים לבנות הכול בזמן סביר,</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line8"
         x="990.333"
         y="631.501">יהיה לנו זיכרון מתפקד קטן יותר, שנוכל להשתמש בו</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line9"
         x="990.333"
         y="682.002">להדגמות, ובהמשך, כשנקבל עוד אנשים, נוכל</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line10"
         x="990.333"
         y="732.502">להשלים אותו.</tspan></text>
  </g>
</svg>
