       font-weight="400"
       fill="#000000"
       stroke="none"
       xml:space="preserve"><tspan
         x="1391.99999"
         y="80"
         id="tspan1">כשטיורינג ניתח מה יכולה לעשות מכונת חישוב,</tspan><tspan
         x="1391.99999"
         y="130.5"
         id="tspan2">הוא הבין שכדי שמכונה אחת תוכל לבצע את כל</tspan><tspan
         x="1391.99999"
         y="181"
         id="tspan3">החישובים צריכות להיות לה מספר יכולות</tspan><tspan
         x="1391.99999"
         y="231.5"
         id="tspan4">בסיסיות. למחשב שבנינו אין את כל היכולות</tspan><tspan
         x="1391.99999"
         y="282"
         id="tspan5">האלה. הפעולות הבסיסיות של ה-ALU מספיקות כדי</tspan><tspan
         x="1391.99999"
         y="332.5"
         id="tspan6">לבצע כל חישוב, אבל העובדה שההוראות שהוא</tspan><tspan
         x="1391.99999"
         y="383"
         id="tspan7">מקבל קבועות מראש ולא יכולות להיות תלויות</tspan><tspan
         x="1391.99999"
         y="433.5"
         id="tspan8">בתוצאות ביניים של החישוב מגבילה אותנו יותר</tspan><tspan
         x="1391.99999"
