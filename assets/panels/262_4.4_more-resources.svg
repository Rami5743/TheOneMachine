    <text
       id="bubble-text"
       text-anchor="start"
       direction="rtl"
       unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif"
       font-size="34px"
       font-weight="400"
       fill="#000000"
       stroke="none"
       xml:space="preserve"><tspan
         x="1391.99999"
         y="80"
         id="tspan1">אני ואתה מבינים את זה. אבל אנחנו צריכים</tspan><tspan
         x="1391.99999"
         y="130.5"
         id="tspan2">לשכנע את שאר העולם. או לפחות את רוברט.</tspan><tspan
         x="1391.99999"
         y="181"
         id="tspan3">אנחנו צריכים עוד משאבים. עוד ידיים עובדות</tspan><tspan
         x="1391.99999"
         y="231.5"
         id="tspan4">כדי להרחיב את הזיכרון, מערכת קירור כדי</tspan><tspan
         x="1391.99999"
         y="282"
         id="tspan5">שיהיה אפשר להעלות את המהירות של המכונה</tspan><tspan
         x="1391.99999"
         y="332.5"
         id="tspan6">בלי שהיא תהרוס את עצמה מחום, והדבר הכי</tspan><tspan
         x="1391.99999"
         y="383"
         id="tspan7">חשוב, עוד אנשים כדי שיתכנתו אותה. לכתוב</tspan><tspan
         x="1391.99999"
         y="433.5"
         id="tspan8">הוראות עם אפסים ואחדים זה הרבה יותר קל</tspan><tspan
         x="1391.99999"
         y="484"
         id="tspan9">מלבנות מכונות כל פעם מחדש, אבל זה עדיין</tspan><tspan
         x="1391.99999"
         y="534.5"
         id="tspan10">לא קל, בטח אם אנחנו רוצים שהמכונה תוכל</tspan><tspan
         x="1391.99999"
         y="585"
         id="tspan11">לעשות חישובים מסובכים.</tspan></text>
