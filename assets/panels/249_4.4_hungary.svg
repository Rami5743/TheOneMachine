    <text id="bubble-text" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1060" y="80" id="tspan1">לפני כמה חודשים הנאצים כבשו את הונגריה. אבד</tspan><tspan x="1060" y="130.5" id="tspan2">לי הקשר עם המשפחה שלי שם. לא יודע כמה מהם</tspan><tspan x="1060" y="181" id="tspan3">שרדו, אבל אני יודע שאם לא נמהר הנאצים ירצחו</tspan><tspan x="1060" y="231.5" id="tspan4">את כולם. זה שנדבר על זה לא יעזור. הדבר</tspan><tspan x="1060" y="282" id="tspan5">היחיד שאנחנו יכולים לעשות בשבילם עכשיו זה</tspan><tspan x="1060" y="332.5" id="tspan6">להמשיך לעבוד בכל הכוח.</tspan></text>
