    <path id="speech-bubble" d="M 719.51169,40 H 1400.48831 C 1413.49611,40 1420,47.33333 1420,62 V 340.5 C 1420,355.16667 1413.4961,362.5 1400.48831,362.5 H 719.51169 C 706.50389,362.5 700,355.16667 700,340.5 V 212.26 L 614,300 L 700,190.24 V 62 C 700,47.33333 706.50389,40 719.51169,40 Z" fill="#ffffff" stroke="#000000"
