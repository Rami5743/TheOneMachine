    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:40px;line-height:1.4500;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="938.50000"
     y="136.28400"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="938.50000"
       y="136.28400">כשאני מדבר על מספרים 16 ספרתיים אני כמובן כולל גם</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="938.50000"
       y="194.28400">מספרים עם פחות ספרות, פשוט אפשר לכתוב 0 בספרות שלא</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="938.50000"
       y="252.28400">מופיעות. אפשר לעשות את זה גם בשיטה העשרונית. למשל,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="938.50000"
       y="310.28400">לכתוב 032 במקום 32. ביום יום זה לא מקובל, כי ה-0 סתם</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="938.50000"
       y="368.28400">נראה מיותר, אבל בעולם של מכונות חישוב, זה מאוד נוח,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="938.50000"
       y="426.28400">כי המכונות שלנו עובדות עם מספר קבוע של ספרות, אנחנו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="938.50000"
       y="484.28400">הרי לא רוצים לחבר כל פעם את החוטים מחדש. לכן, אנחנו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="938.50000"
       y="542.28400">קובעים מראש את מספר הספרות וכותבים 0 בספרות שלא</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="938.50000"
       y="600.28400">צריך. אנחנו גם מקפידים שלא לחרוג ממספר הספרות</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line10"
       x="938.50000"
       y="658.28400">שקבענו.</tspan></text>
