    <text id="bubble-text" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1392" y="80" id="tspan1">בוקר טוב, שמעת את החדשות? הכוחות שלנו נחתו</tspan><tspan x="1392" y="130.5" id="tspan2">בנורמנדי. אלה חדשות נהדרות, זו כבר לא שאלה</tspan><tspan x="1392" y="181" id="tspan3">של האם ננצח אלא מתי ננצח. אבל זה לא הופך את</tspan><tspan x="1392" y="231.5" id="tspan4">הפרויקט שלנו למיותר. להפך, רק לדחוף יותר.</tspan><tspan x="1392" y="282" id="tspan5">בפלישה עצמה נהרגו לנו אלפי חיילים, אנחנו</tspan><tspan x="1392" y="332.5" id="tspan6">עוד לא יודעים בדיוק כמה. בכל יום נהרגים</tspan><tspan x="1392" y="383" id="tspan7">הרבה אלפים של אנשים. ככל שנגמור מוקדם יותר,</tspan><tspan x="1392" y="433.5" id="tspan8">נציל יותר אנשים.</tspan></text>
  </g>
