  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 683.51169,40 H 1400.48831 C 1413.49611,40 1420,47.33333 1420,62 V 441.5 C 1420,456.16667 1413.4961,463.5 1400.48831,463.5 H 683.51169 C 670.50389,463.5 664,456.16667 664,441.5 V 262.76 L 614,300 L 664,240.74 V 62 C 664,47.33333 670.50389,40 683.51169,40 Z" fill="#ffffff" stroke="#000000"
