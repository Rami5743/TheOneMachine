       x="1394"
       y="78"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="1394"
         y="78">הפקודות יהיו רשומות בזיכרון. כדי להקל על</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="1394"
         y="128.5002">העבודה, הזיכרון שלנו יהיה מחולק ל-2</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="1394"
         y="179.0004">חלקים:</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="1394"
         y="229.5006">• זיכרון דאטה (בקיצור &quot;הזיכרון&quot;) — זה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="1394"
         y="280.00079">כרטיס ה-RAM שבנית — הוא יכיל את המידע</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="1394"
         y="330.50098">שעליו אנחנו רוצים לבצע את החישובים</tspan><tspan
