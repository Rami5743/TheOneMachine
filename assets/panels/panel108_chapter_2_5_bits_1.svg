    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:40px;line-height:1.4500;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="948.50000"
     y="136.28400"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="948.50000"
       y="136.28400">מצוין, אני רואה שהבנת את הפרינציפ. עכשיו צריך ללמד</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="948.50000"
       y="194.28400">את זה את המחשב שלנו. אנחנו יכולים לייצג מספרים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="948.50000"
       y="252.28400">באמצעות רצף של ביטים. אם אנחנו רוצים לבנות כרטיס</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="948.50000"
       y="310.28400">שיבצע פעולה עם מספרים, אנחנו נכניס לתוכו בסים שייצגו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="948.50000"
       y="368.28400">מספרים. בס ברוחב 4 יכול לייצג מספר 4 ספרתי בשיטה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="948.50000"
       y="426.28400">הבינרית. אני לא בטוח שזה מספיק לנו. מה המספר הכי</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="948.50000"
       y="484.28400">גדול שאפשר לייצג כך?</tspan></text>
