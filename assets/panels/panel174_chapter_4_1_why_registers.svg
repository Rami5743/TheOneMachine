    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="1017"
       y="220"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="1017"
         y="220">אתה בטח רוצה לשאול למה אנחנו צריכים עוד</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="1017"
         y="270.5">רגיסטרים כשיש לנו כבר יותר מ-1000 רגיסטרים</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="1017"
         y="321">בזיכרון. העניין הוא שכדי לפנות לרגיסטר בזיכרון</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="1017"
         y="371.501">אנחנו צריכים כתובת, מה שמסבך את הפנייה.</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="1017"
         y="422.001">הרגיסטרים של המעבד מחוברים באופן ישיר לאן</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="1017"
         y="472.501">שהם צריכים להיות מחוברים ולכן קל בהרבה לטפל</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line7"
         x="1017"
         y="523.001">בהם.</tspan></text>
