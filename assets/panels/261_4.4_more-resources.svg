  <image id="raster-base" x="0" y="0" width="1448" height="1086"
     preserveAspectRatio="none" href="259_4.4_we-did-it.jpg" xlink:href="259_4.4_we-did-it.jpg" />
  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 719.51169,40 H 1404.48831 C 1417.49611,40 1424,47.33333 1424,62 V 593 C 1424,607.66667 1417.4961,615 1404.48831,615 H 719.51169 C 706.50389,615 700,607.66667 700,593 V 353.5 L 565,318 L 700,301.5 V 62 C 700,47.33333 706.50389,40 719.51169,40 Z" fill="#ffffff" stroke="#000000"
       stroke-width="3.44993" stroke-linejoin="round" stroke-linecap="round" />
    <text id="bubble-text" text-anchor="start" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1396" y="80" id="tspan1">אני ואתה מבינים את זה. אבל אנחנו צריכים</tspan><tspan x="1396" y="130.5" id="tspan2">לשכנע את שאר העולם. או לפחות את רוברט.</tspan><tspan x="1396" y="181" id="tspan3">אנחנו צריכים עוד משאבים. עוד ידיים עובדות</tspan><tspan x="1396" y="231.5" id="tspan4">כדי להרחיב את הזיכרון. מערכת קירור כדי</tspan><tspan x="1396" y="282" id="tspan5">שיהיה אפשר להעלות את המהירות של המכונה</tspan><tspan x="1396" y="332.5" id="tspan6">בלי שהיא תהרוס את עצמה מחום, והדבר הכי</tspan><tspan x="1396" y="383" id="tspan7">חשוב, עוד אנשים כדי שיתכנתו אותה. לכתוב</tspan><tspan x="1396" y="433.5" id="tspan8">הוראות עם אפסים ואחדים זה הרבה יותר קל</tspan><tspan x="1396" y="484" id="tspan9">מלבנות מכונות כל פעם מחדש, אבל זה עדיין</tspan><tspan x="1396" y="534.5" id="tspan10">לא קל, בטח אם אנחנו רוצים שהמכונה תוכל</tspan><tspan x="1396" y="585" id="tspan11">לעשות חישובים מסובכים.</tspan></text>
  </g>
</svg>
