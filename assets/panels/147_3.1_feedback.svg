     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="782.00000"
       y="86.00000">הדרך לעשות את זה היא לחבר יציאות חזרה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="782.00000"
       y="136.50000">לכניסות, כך שנוצר מעין מעגל. שים לב,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="782.00000"
       y="187.00000">ה-NANDים ברכיבים השונים לא מגיבים מיד.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="782.00000"
       y="237.50000">אם אתה משנה את הכניסה לוקח זמן מה עד</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="782.00000"
       y="288.00000">שהיציאה משתנה בהתאם.</tspan></text>
