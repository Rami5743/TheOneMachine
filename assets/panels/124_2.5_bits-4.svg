     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="943.15399"
       y="135.17786">נכון. עם 10 ביטים אפשר לייצג 1024 מספרים שזה בערך</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="943.15399"
