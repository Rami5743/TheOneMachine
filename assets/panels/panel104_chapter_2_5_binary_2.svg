    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:29.7181px;line-height:1.3125;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="910.91260"
     y="76.92842"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="910.91260"
       y="76.92842">השיטה לכתוב מספרים עם ביטים נקראת השיטה הבינרית,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="910.91260"
       y="115.93336">כתיבה בבסיס ספירה 2. היא דומה לשיטה העשרונית שאתה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="910.91260"
       y="154.93831">מכיר אבל הבסיס הוא 2 במקום 10. כשכותבים בשיטה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="910.91260"
       y="193.94325">הבינרית הספרה הימנית ביותר היא ספרת האחדות (כמו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="910.91260"
       y="232.94820">בשיטה העשרונית). הספרה הבאה מימין היא ספרת ה-2,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="910.91260"
       y="271.95314">אחריה ספרת ה-4 אז ספרת ה-8 וכך הלאה (כל פעם</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="910.91260"
       y="310.95808">מכפילים פי-2). כל ספרה היא בעצם ביט (היא יכולה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="910.91260"
       y="349.96303">להיות רק 0 או 1). למשל המספר 101 בשיטה הבינרית</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="910.91260"
       y="388.96797">הוא 5: ה-1 הימני מייצג 1, ה-0 שאחריו מייצג 0 פעמים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line10"
       x="910.91260"
       y="427.97292">2 (שהם 0) וה-1 שאחריו מייצג 4. דוגמה נוספת היא</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line11"
       x="910.91260"
       y="466.97786">המספר 111 שהוא המספר התלת-ספרתי הגדול ביותר</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line12"
       x="910.91260"
       y="505.98280">בשיטה הבינרית. הוא למעשה המספר 1+2+4=7. בשביל</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line13"
       x="910.91260"
       y="544.98775">לכתוב 8 יש צורך בספרה נוספת: 1000. באופן כללי</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line14"
       x="910.91260"
       y="583.99269">התפקיד של כל ספרה הוא פי 2 יותר מאשר של הספרה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line15"
       x="910.91260"
       y="622.99763">הקודמת, בדיוק כמו שבשיטה העשרונית התפקיד של כל</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line16"
       x="910.91260"
       y="662.00258">ספרה הוא פי-10 יותר משל הספרה הקודמת.</tspan></text>
  </g>
</svg>
