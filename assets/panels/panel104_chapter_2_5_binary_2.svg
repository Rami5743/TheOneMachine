    <path
       id="speech-bubble"
       d="m 572.53545,32.000136 h 668.65635 c 16.5782,0 16.5782,0 16.5782,28.033488 V 662.75361 c 0,28.03349 0,28.03349 -16.5782,28.03349 H 572.53545 c -16.57825,0 -16.57825,0 -16.57825,-28.03349 V 207.08498 L 390.74397,171.6745 555.9572,176.85652 V 60.033624 c 0,-28.033488 0,-28.033488 16.57825,-28.033488 z"
