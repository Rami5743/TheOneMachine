     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="865.33191"
       y="114.10649">יש כאן כמה תרגילים על השיטה הבינרית. לפני</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="865.33191"
       y="174.10649">שאתה מלמד את המחשב לעבוד עם השיטה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="865.33191"
       y="234.10649">הבינרית, כדאי שתכיר אותה טוב בעצמך.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="865.33191"
       y="294.10649">אני הולך עכשיו לפגוש את נילס בוהר. הוא</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="865.33191"
       y="354.10649">הגיע מאנגליה. מזל שהוא הצליח לצאת</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="865.33191"
       y="414.10649">מדנמרק ברגע האחרון.</tspan></text>
