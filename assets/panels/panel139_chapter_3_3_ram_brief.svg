<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg version="1.1" width="1448" height="1086" viewBox="0 0 1448 1086"
   preserveAspectRatio="xMidYMid meet"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns:xlink="http://www.w3.org/1999/xlink"
   xmlns="http://www.w3.org/2000/svg">
  <image id="raster-base" x="0" y="0" width="1448" height="1086"
     preserveAspectRatio="none" href="panel131_chapter_3_1_more_memory.jpg" xlink:href="panel131_chapter_3_1_more_memory.jpg" />
  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 609.51169,40 H 1390.48831 C 1403.49611,40 1410,47.33333 1410,62 V 694 C 1410,708.66667 1403.4961,716 1390.48831,716 H 609.51169 C 596.50389,716 590,708.66667 590,694 V 123.23 L 544.47133,129.92 L 590,101.21 V 62 C 590,47.33333 596.50389,40 609.51169,40 Z" fill="#ffffff" stroke="#000000"
       stroke-width="3.44993" stroke-linejoin="round" stroke-linecap="round" />
    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="1000.00000"
     y="80.00000"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="1000.00000"
       y="80.00000">אנחנו נרצה שלמחשב שלנו יהיה זיכרון הרבה יותר גדול</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="1000.00000"
       y="130.50000">מרגיסטר אחד. 1000 רגיסטרים אמורים להספיק</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="1000.00000"
       y="181.00000">בינתיים. זה לא מעשי לכתוב בו זמנית ל-1000</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="1000.00000"
       y="231.50000">רגיסטרים. לכן בכל רגע נכתוב רק לרגיסטר אחד.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="1000.00000"
       y="282.00000">לזיכרון שלנו יהיו 2 כניסות. אחת אומרת מה אנחנו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="1000.00000"
       y="332.50000">רוצים לכתוב לתוכו והשנייה אומרת לאיזה רגיסטר</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="1000.00000"
       y="383.00000">אנחנו רוצים לכתוב. כמובן יש גם את כניסת הבקרה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="1000.00000"
       y="433.50000">שאומרת האם אנחנו רוצים לכתוב. כמו שאתה יודע, אי</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="1000.00000"
       y="484.00000">אפשר לשנות את החיבורים בזמן פעולת המחשב, כך</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line10"
       x="1000.00000"
       y="534.50000">שהכניסות צריכות להיות מחוברות לכל הרגיסטרים,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line11"
       x="1000.00000"
       y="585.00000">אבל אנחנו יכולים להשתמש ב-MUX כדי לגרום רק</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line12"
       x="1000.00000"
       y="635.50000">לרגיסטר אחד להיות פעיל. תתחיל עם זיכרונות קטנים,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line13"
       x="1000.00000"
       y="686.00000">ותעבור בהדרגתיות ליותר גדולים.</tspan></text>
  </g>
</svg>
