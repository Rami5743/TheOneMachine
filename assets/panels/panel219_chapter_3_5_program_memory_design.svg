  <image id="raster-base" x="0" y="0" width="1448" height="1086"
     preserveAspectRatio="none" href="panel131_chapter_3_1_more_memory.jpg" xlink:href="panel131_chapter_3_1_more_memory.jpg" />
  <g id="text-bubble-layer" inkscape:groupmode="layer" inkscape:label="Text bubble">
    <path id="speech-bubble" d="M 490.51169,40 H 1380.48831 C 1393.49611,40 1400,47.33333 1400,62 V 694 C 1400,708.66667 1393.4961,716 1380.48831,716 H 490.51169 C 477.50389,716 471,708.66667 471,694 V 123.23 L 425.47133,129.92 L 471,101.21 V 62 C 471,47.33333 477.50389,40 490.51169,40 Z" fill="#ffffff" stroke="#000000"
       stroke-width="3.44993" stroke-linejoin="round" stroke-linecap="round" />
    <text id="bubble-text" text-anchor="middle" direction="rtl" unicode-bidi="plaintext"
       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="935.5" y="80" id="tspan1">הזיכרון הזה נקרא זיכרון תוכנה. הוא יהיה כמעט זהה</tspan><tspan x="935.5" y="130.5" id="tspan2">ל-RAM. אבל עם כמה הבדלים קטנים. לא נצטרך שום פורטים</tspan><tspan x="935.5" y="181" id="tspan3">ולא נצטרך לאפשר למחשב שלנו לכתוב לתוכו, רק לקרוא</tspan><tspan x="935.5" y="231.5" id="tspan4">ממנו. אולם אנחנו כן רוצים לכתוב לתוכו ממקום אחר. כך</tspan><tspan x="935.5" y="282" id="tspan5">שלא נוותר על כניסת הדאטה של הזיכרון. אנחנו לא רוצים</tspan><tspan x="935.5" y="332.5" id="tspan6">לנתק אותו בכל פעם שאנחנו רוצים לכתוב לתוכו, לכן ניתן</tspan><tspan x="935.5" y="383" id="tspan7">לו עוד כניסת כתובת ונשתמש בה בשביל לכתוב. מכיוון</tspan><tspan x="935.5" y="433.5" id="tspan8">שהזיכרונות שלנו לא מאפשרים כתיבה וקריאה לכתובות</tspan><tspan x="935.5" y="484" id="tspan9">שונות בפועל, כאשר כניסת הבקרה של הזיכרון תפתח אותו</tspan><tspan x="935.5" y="534.5" id="tspan10">לכתיבה נצטרך לגרום לזיכרון להתעלם מכתובת הקריאה</tspan><tspan x="935.5" y="585" id="tspan11">הרגילה שלו ולהשתמש רק בכתובת הכתיבה. בדרך כלל הוא</tspan><tspan x="935.5" y="635.5" id="tspan12">יהיה נעול לכתיבה, ואז נתעלם מכתובת הכתיבה.</tspan><tspan x="935.5" y="686" id="tspan13">גם כאן נסתפק בזיכרון בגודל 1024 רגיסטרים.</tspan></text>
  </g>
</svg>
