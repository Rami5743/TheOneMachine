       font-family="'Noto Sans Hebrew', Arial, sans-serif" font-size="34px" font-weight="400" fill="#000000"
       stroke="none" xml:space="preserve"><tspan x="1025" y="80" id="tspan1">נהדר! הכל עבד. נמשיך מחר. עכשיו רק 11 בערב,</tspan><tspan x="1025" y="130.5" id="tspan2">אבל הגנרל גרובס רוצה לספר לנו משהו דחוף.</tspan><tspan x="1025" y="181" id="tspan3">למזלך אתה פטור מביזבוזי הזמן האלה, אני לא.</tspan><tspan x="1025" y="231.5" id="tspan4">טוב, אין לי מה להתלונן, הוא כמעט ולא מפריע</tspan><tspan x="1025" y="282" id="tspan5">לעבוד בזכותו כל הבסיס הזה מתקתק כמו שעון.</tspan></text>
