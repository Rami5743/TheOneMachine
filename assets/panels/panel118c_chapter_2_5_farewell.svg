    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:36.2908px;line-height:1.4500;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="945.19293"
     y="63.94368"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="945.19293"
       y="63.94368">אני צריך לחזור לנילס. יש לו רעיון הזוי לחלוק עם</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="945.19293"
       y="116.56541">הקומוניסטים את הפרויקט שלנו. אני צריך להוריד אותו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="945.19293"
       y="169.18713">מזה, ומהר. אומנם עכשיו יש לנו אויב משותף, אבל</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="945.19293"
       y="221.80887">סטלין לא הרבה פחות גרוע מהיטלר, וזה יהיה אסון לתת</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="945.19293"
       y="274.43060">לו נשק כזה, גם אם זה יקדם אותנו קצת בפרויקט. מצד</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="945.19293"
       y="327.05234">שני קשה לשפוט את נילס, הוא היה בדנמרק כשהנאצים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="945.19293"
       y="379.67407">נכנסו ושמע מקרוב על הזוועות של הנאצים שעליהם אנחנו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="945.19293"
       y="432.29578">שומעים מרחוק.</tspan></text>
  </g>
