       stroke="none" xml:space="preserve"><tspan x="773.5858450000001" y="80" id="tspan1">אנחנו צריכים לבדוק אותו טוב טוב לפני</tspan><tspan x="773.5858450000001" y="130.5" id="tspan2">שאנחנו מתקדמים. הבדיקות שכתבת קודם</tspan><tspan x="773.5858450000001" y="181" id="tspan3">הם טובות אבל לא מספיקות. אנחנו רוצים</tspan><tspan x="773.5858450000001" y="231.5" id="tspan4">לכתוב תוכנה שתבדוק גם את הקלט והפלט</tspan><tspan x="773.5858450000001" y="282" id="tspan5">ובכלל את כל התהליך מהתחלה ועד הסוף.</tspan></text>
