       stroke="none" xml:space="preserve"><tspan x="1380" y="80" id="tspan1">אנחנו צריכים לבדוק אותו טוב טוב לפני</tspan><tspan x="1380" y="130.5" id="tspan2">שאנחנו מתקדמים. הבדיקות שכתבת קודם הן</tspan><tspan x="1380" y="181" id="tspan3">טובות אבל לא מספיקות. אנחנו רוצים לכתוב</tspan><tspan x="1380" y="231.5" id="tspan4">תוכנה שתבדוק גם את הקלט והפלט ובכלל את</tspan><tspan x="1380" y="282" id="tspan5">כל התהליך מהתחלה ועד הסוף.</tspan></text>
