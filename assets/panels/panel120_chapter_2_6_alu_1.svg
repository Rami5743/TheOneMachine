    <path id="speech-bubble" d="m 543.21677,24.53150 h 800.52203 c 12.4792,0 22.5953,10.481415 22.5953,22.595380 V 349.05233 c 0,12.92948 -22.5953,22.5954 -22.5953,22.5954 H 543.21677 c -12.47908,0 -22.59538,-10.48142 -22.59538,-22.5954 V 203.09988 L 412.23521,166.14354 520.62139,174.5712 V 47.126884 c 0,-12.929479 22.5954,-22.595380 22.59538,-22.595380 z"
