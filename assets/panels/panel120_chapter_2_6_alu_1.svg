    <text
     xml:space="preserve"
     style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:36.2908px;line-height:1.4500;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;unicode-bidi:plaintext;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
     x="945.19293"
     y="63.94368"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="945.19293"
       y="63.94368">מצוין. עבודה טובה. עכשיו יש לנו מכונה שמחברת</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="945.19293"
       y="116.56541">מספרים. אנחנו נצטרך עוד מכונות שעושות עוד</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="945.19293"
       y="169.18714">חישובים. אנחנו רוצים לבנות מכונה אחת שתעשה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="945.19293"
       y="221.80887">את כל החישובים שנצטרך. היא תקבל את המספרים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="945.19293"
       y="274.43060">שעליהם אנחנו רוצים לעשות את החישוב ובס נוסף</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="945.19293"
       y="327.05233">שיגיד לה איזה חישוב לעשות.</tspan></text>
  </g>
