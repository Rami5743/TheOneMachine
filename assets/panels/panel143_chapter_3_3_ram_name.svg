    <text
       xml:space="preserve"
       style="font-style:normal;font-variant:normal;font-weight:400;font-stretch:normal;font-size:34px;line-height:1.4853;font-family:'Noto Sans Hebrew', Arial, sans-serif;text-align:center;writing-mode:lr-tb;direction:rtl;text-anchor:middle;fill:#000000;fill-opacity:1;stroke:none"
       x="894.99508"
       y="80"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line1"
         x="894.99508"
         y="80">לזיכרון הזה יש תכונה מיוחדת, אפשר לגשת במהירות לכל</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="894.99508"
         y="130.5002">רגיסטר בזיכרון ולשנות אותו או לקרוא ממנו. קוראים לזיכרון</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="894.99508"
         y="181.0004">כזה RAM אלו הן ראשי תיבות של Random Access Memory</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="894.99508"
         y="231.5006">או בעברית זיכרון גישה אקראית. זהו שם די מטופש, אין כאן</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="894.99508"
         y="282.0008">שום דבר אקראי, שם מתאים יותר היה יכול להיות &quot;זיכרון גישה</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line6"
         x="894.99508"
         y="332.501">ישירה&quot;, אבל נתקענו עם השם הזה.</tspan></text>
