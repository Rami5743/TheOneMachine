     x="836.00000"
     y="107.72777"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="836.00000"
       y="107.72777">אני צריך לספר לך איך מכונות חישוב עובדות</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="836.00000"
       y="165.72777">עם מספרים. זה לא נוח לעבוד עם ספרות.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="836.00000"
       y="223.72777">אנחנו מעדיפים לעבוד עם ביטים. לביט יש</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="836.00000"
       y="281.72777">רק שתי אפשרויות: 0 ו-1. כך שעם ביט אחד</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="836.00000"
       y="339.72777">אפשר לכתוב רק את המספרים האלה. אם אנחנו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="836.00000"
       y="397.72777">רוצים לכתוב את 2 אנחנו נצטרך ביט נוסף.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="836.00000"
       y="455.72777">בדיוק כמו שכשמשתמשים בספרות אנחנו צריכים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="836.00000"
       y="513.72777">ספרה נוספת למספרים שגדולים מ-9.</tspan></text>
