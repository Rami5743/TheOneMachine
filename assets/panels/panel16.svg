     x="211.50835"
     y="64.60753"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="211.50835"
       y="64.60753">אנחנו צריכים לכתוב</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="211.50835"
       y="96.40758">מכתב לנשיא.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="211.50835"
       y="128.20760">להסביר לו את העניין.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="211.50835"
       y="160.00765">הוא צריך להקצות משאבים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="211.50835"
       y="191.79610">לפיתוח פצצה המבוססת</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="211.50835"
       y="223.59612">על ביקוע גרעיני.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="211.50835"
       y="255.39618">הוא חייב לעשות את זה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="211.50835"
       y="287.19620">לפני היטלר.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="211.50835"
       y="318.99625">חשוב שאתה תחתום על המכתב,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line10"
       x="211.50835"
       y="350.78467">את השם אלברט איינשטיין</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line11"
       x="211.50835"
       y="382.58475">כולם מכירים.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line12"
       x="211.50835"
       y="414.38477">את השם ליאו סילארד</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line13"
       x="211.50835"
       y="446.18479">לא ממש.</tspan></text>
