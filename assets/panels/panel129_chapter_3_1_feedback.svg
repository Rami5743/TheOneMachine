       stroke="none" xml:space="preserve"><tspan x="820" y="80" id="tspan1">הדרך לעשות את זה היא לחבר יציאות חזרה</tspan><tspan x="820" y="130.5" id="tspan2">לכניסות, כך שנוצר מעין מעגל. שים לב,</tspan><tspan x="820" y="181" id="tspan3">ה-NANDים ברכיבים השונים לא מגיבים מיד.</tspan><tspan x="820" y="231.5" id="tspan4">אם אתה משנה את הכניסה לוקח זמן מה עד</tspan><tspan x="820" y="282" id="tspan5">שהיציאה משתנה בהתאם.</tspan></text>
