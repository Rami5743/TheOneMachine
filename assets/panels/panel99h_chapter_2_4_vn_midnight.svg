     x="778.00000"
     y="164.19138"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="778.00000"
       y="164.19138">עבודה מצוינת. עכשיו כבר חצות.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="778.00000"
       y="215.19138">אתה יכול ללכת לישון. נמשיך</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="778.00000"
       y="266.19138">לעבוד מחר ב-8 בבוקר. אנחנו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="778.00000"
       y="317.19138">צריכים ללמד את המחשב שלנו</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="778.00000"
       y="368.19138">לעבוד עם מספרים, ולא סתם עם</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="778.00000"
       y="419.19138">ביטים. אני צריך שתיזכר איך</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="778.00000"
       y="470.19138">עושים פעולות חשבון עם</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="778.00000"
       y="521.19138">מספרים גדולים.</tspan></text>
