       stroke="none" xml:space="preserve"><tspan x="820" y="80" id="tspan1">תתחיל מזה. זה כרטיס שיודע לשמור 16</tspan><tspan x="820" y="130.5" id="tspan2">ביטים. כמו שאמרו קודם, אנחנו נשתמש</tspan><tspan x="820" y="181" id="tspan3">ב-16 ביטים בשביל לשמור מספרים. ובכלל,</tspan><tspan x="820" y="231.5" id="tspan4">זאת תהיה היחידה הבסיסית של מידע</tspan><tspan x="820" y="282" id="tspan5">שהמחשב שלנו עובד איתה.</tspan></text>
