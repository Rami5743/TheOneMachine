       x="786"
       y="80"
       id="bubble-text"><tspan
         sodipodi:role="line"
         id="bubble-text-line2"
         x="786"
         y="80">תתחיל מזה. זה כרטיס שיודע לשמור 16 ביטים.</tspan><tspan
         sodipodi:role="line"
         x="786"
         y="130.5002"
         id="tspan2">קוראים לכרטיס כזה &quot;רגיסטר&quot; (בעברית &quot;אוגר&quot;).</tspan><tspan
         sodipodi:role="line"
         x="786"
         y="181.0004"
         id="tspan1">כמו שאמרנו קודם, אנחנו נשתמש</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line3"
         x="786"
         y="231.5006">ב-16 ביטים בשביל לשמור מספרים. ובכלל,</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line4"
         x="786"
         y="282.00079">זאת תהיה היחידה הבסיסית של מידע</tspan><tspan
         sodipodi:role="line"
         id="bubble-text-line5"
         x="786"
         y="332.50098">שהמחשב שלנו עובד איתה.</tspan></text>
