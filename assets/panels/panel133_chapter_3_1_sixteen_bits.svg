    <path id="speech-bubble" d="M 492,40 H 1148 Q 1170,40 1170,62 V 290 Q 1170,312 1148,312 H 492 Q 470,312 470,290 V 306 L 392,346 L 470,290 V 62 Q 470,40 492,40 Z" fill="#ffffff" stroke="#000000"
