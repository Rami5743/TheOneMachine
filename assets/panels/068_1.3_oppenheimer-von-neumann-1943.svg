     x="875.25165"
     y="61.25627"
     id="bubble-text"
     ><tspan
       sodipodi:role="line"
       id="bubble-text-line1"
       x="875.25165"
       y="61.25627">אי אפשר לעבוד כך.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line2"
       x="875.25165"
       y="92.17036">החישובים לוקחים יותר מדי זמן.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line3"
       x="875.25165"
       y="123.08445">עד שנגמור את הפצצה</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line4"
       x="875.25165"
       y="153.99854">הנאצים יהרסו את כל אירופה.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line5"
       x="875.25165"
       y="184.91263">יש לי עדיין קרובים בהונגריה,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line6"
       x="875.25165"
       y="215.82672">כרגע הם יחסית בטוחים,</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line7"
       x="875.25165"
       y="246.74082">אבל זה יכול להשתנות בכל רגע.</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line8"
       x="875.25165"
       y="277.65492">אומרים שהנאצים רוצחים</tspan><tspan
       sodipodi:role="line"
       id="bubble-text-line9"
       x="875.25165"
       y="308.56902">את כל היהודים שהם יכולים.</tspan></text>
